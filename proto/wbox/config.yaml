# wbox workspace for the GUI prototypes: each one runs in a nested
# compositor, offscreen, so a benchmark never opens a window on the desktop
# (WBOX_VISIBLE=1 shows it).
name: helios-proto-wbox
compositor: labwc
screen: 1280x800
input_backend: hybrid
headless: true
keyboard_layout: us
clipboard_bridge: false
log:
  dir: ./log
  level: info
screenshot_dir: ./screenshots
timeouts:
  app_render: 5
  stop: 20
app:
  command: ./app.sh
