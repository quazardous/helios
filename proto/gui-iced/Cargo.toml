[package]
name = "helios-proto-iced"
description = "GUI prototype in iced: float viewport, panes, a large graph"
version = "0.0.1"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

[dependencies]
helios-proto-scene = { path = "../scene" }
iced = { version = "0.14", features = ["wgpu", "canvas", "advanced"] }
bytemuck = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
