# Helios decoder and camera-name regression corpus: the manifest.
# tools/bench/fill-corpus.sh downloads the "core" files; crates/helios-corpus
# checks them against the expectations below (see docs/raw-corpus.md).
# Source: raw.pixls.us (repository JSON: https://raw.pixls.us/json/getrepository.php?set=all),
# fetched 2026-10-12. Every entry is CC0 per the per-file licence column of that JSON.
# sha256 and size_mb are the values published by raw.pixls.us (size rounded, in MB as shown);
# re-verify sha256 after download and record the exact byte size then.
# exif_make / exif_model come from the raw.pixls.us exiv2 dump of the same file (trailing
# spaces kept, they are part of the test). rawler_name / rawspeed_name are predictions from
# rawler 0.8.0 data/cameras/*.toml and the rawspeed cameras.xml in the darktable fork;
# the corpus test must assert what rawler actually reports and the mapping table must
# resolve it to rawspeed_name.

[corpus]
name = "helios-raw-corpus"
version = 1
source = "https://raw.pixls.us/"
rawler_version = "0.8.0"
licence_default = "CC0-1.0"
fetch_url_pattern = "https://raw.pixls.us/getfile.php/{pixls_id}/nice/{filename}"
mirror = "https://raw.pixls.us/data.lfs.git"
tiers = { core = "in the box volume and checked by the raw-corpus job", pending = "catalogued, not fetched yet: switch to core and provision again to add it" }

