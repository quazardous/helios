# typos: spelling of code, comments and docs (`typos`, or `cargo xtask lint`).
# https://github.com/crate-ci/typos/blob/master/docs/reference.md

[files]
extend-exclude = [
    # Translations other than English are not English.
    "i18n/fr/",
    # A plugin's own translations, beside its manifest.
    "plugins/*/*/i18n/fr/",
    # A template's own translations, in its bundle.
    "templates/*/i18n/fr/",
    # Hashes of the English text, in hex.
    "i18n/*/english.hashes",
]

[default.extend-words]
# Integer pixel coordinates next to `ix`, as in vkdt's shaders.
iy = "iy"
# A job named after the two it waits for, in the scheduler tests.
ba = "ba"
# A misspelled token on purpose: the theme test checks it is reported.
acent = "acent"
# darktable's and vkdt's own names, kept as their sources spell them:
# colorcorrection's parameter and vkdt's highlights module.
ccorrect = "ccorrect"
hilights = "hilights"
# The raw corpus (tests/raw-corpus.toml): Leica's camera name, rawler's
# error message as it spells it, and an id cut from raw.pixls.us's file name.
monochrom = "monochrom"
efficency = "efficency"
compres = "compres"
# French, in the tests that read translated text.
sur = "sur"
