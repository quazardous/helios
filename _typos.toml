# typos: spelling of code, comments and docs (`typos`, or `cargo xtask lint`).
# https://github.com/crate-ci/typos/blob/master/docs/reference.md

[files]
extend-exclude = [
    # Translations other than English are not English.
    "i18n/fr/",
    # A plugin's own translations, beside its manifest.
    "plugins/*/*/i18n/fr/",
    # A template's own translations, in its bundle.
    "templates/*/i18n/fr/",
    # Hashes of the English text, in hex.
    "i18n/*/english.hashes",
    # Thumbnails of the raw corpus: binary PPM pictures, not text.
    "tests/raw-corpus-thumbs/",
]

[default]
# "PNGs": the plural of PNG, split as PN + Gs by typos.
extend-ignore-re = ["PNGs"]

[default.extend-words]
# Integer pixel coordinates next to `ix`, as in vkdt's shaders.
iy = "iy"
# A job named after the two it waits for, in the scheduler tests.
ba = "ba"
# A misspelled token on purpose: the theme test checks it is reported.
acent = "acent"
# darktable's and vkdt's own names, kept as their sources spell them:
# colorcorrection's parameter and vkdt's highlights module.
ccorrect = "ccorrect"
hilights = "hilights"
# The raw corpus (tests/raw-corpus.toml): Leica's camera name, rawler's
# error message as it spells it, and an id cut from raw.pixls.us's file name.
monochrom = "monochrom"
efficency = "efficency"
compres = "compres"
# French, in the tests that read translated text and their samples.
sur = "sur"
espace = "espace"
commandes = "commandes"
mariage = "mariage"
chambre = "chambre"
# A parametric coordinate next to `iy`, as `ix` and `iy` elsewhere.
iz = "iz"
# Houdini's digital assets (HDA), in the macro design note.
hda = "hda"
# HDR metadata: maximum content light level (CLL).
cll = "cll"
# The ergonomics notes quote apps that spell it this way.
togglable = "togglable"
# The zlib crate `flate2`.
flate = "flate"
