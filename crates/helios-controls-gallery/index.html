<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Helios controls gallery</title>
    <!-- For Trunk (`trunk serve` or `trunk build` in this directory). -->
    <link data-trunk rel="rust" data-bin="helios-controls-gallery" />
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #1b1916; }
      #the_canvas_id { display: block; width: 100%; height: 100%; touch-action: none; }
    </style>
  </head>
  <body>
    <canvas id="the_canvas_id"></canvas>
    <noscript><p>The gallery needs JavaScript and WebAssembly.</p></noscript>
  </body>
</html>
