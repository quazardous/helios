# Per-module CPU vs GPU budgets for `cargo xtask engine-diffstat` (helios_gpu::diffstat).
#
# Each module's budget is the measured distance times 4, with a floor of
# 1e-6 for max_abs and 1e-7 for mean_abs (a few float steps of 1.0), so
# float rounding never trips it but a real parity bug does. `over` is the
# share of pixels past the threshold (1/255): measured 0 everywhere, and the
# budget keeps it at 0. Pixel values are linear, 1.0 = white.
#
# Budgets are per adapter: an `[[adapter]]` entry applies when the adapter
# description diffstat prints ("GPU: ...") starts with its `name`. Fixtures
# tone and vkdt, 512x384 synthetic input, tiles of 64 px. `measured` holds
# the run's values; `alone` = the module on the CPU's input, `chain` =
# through the fixture's pipeline.
#
# CI's test job runs `cargo xtask engine-diffstat all --budgets` on lavapipe
# (its software Vulkan): a module over its budget, one without a budget, or
# a GPU kernel that fell back to the CPU fails it. A new adapter, or a
# module added to a fixture, is measured first (`--json`), then added here
# by the same rule.

threshold = 0.00392156862745098
tile = 64

# The bench box's GPU, box job `diffstat`.
[[adapter]]
name = "NVIDIA GeForce RTX 3070"
measured_on = "2026-11-20"

[[adapter.module]]
fixture = "tone"
node = "exposure"
module = "exposure"
alone.measured = { max_abs = 0, mean_abs = 0, over = 0, worst_tile = [0, 0, 64, 64] }
alone.budget = { max_abs = 1e-06, mean_abs = 1e-07, over = 0.0 }
chain.measured = { max_abs = 0, mean_abs = 0, over = 0, worst_tile = [0, 0, 64, 64] }
chain.budget = { max_abs = 1e-06, mean_abs = 1e-07, over = 0.0 }

[[adapter.module]]
fixture = "tone"
node = "blur"
module = "blur"
alone.measured = { max_abs = 2.861e-06, mean_abs = 2.428e-07, over = 0, worst_tile = [448, 320, 64, 64] }
alone.budget = { max_abs = 1.2e-05, mean_abs = 9.8e-07, over = 0.0 }
chain.measured = { max_abs = 2.861e-06, mean_abs = 2.428e-07, over = 0, worst_tile = [448, 320, 64, 64] }
chain.budget = { max_abs = 1.2e-05, mean_abs = 9.8e-07, over = 0.0 }

[[adapter.module]]
