# Per-module CPU vs GPU budgets for `cargo xtask engine-diffstat` (helios_gpu::diffstat).
#
# Each module's budget is the measured distance times 4, with a floor of
# 1e-6 for max_abs and 1e-7 for mean_abs (a few float steps of 1.0), so
# float rounding never trips it but a real parity bug does. `over` is the
# share of pixels past the threshold (1/255): measured 0 everywhere, and the
# budget keeps it at 0. Pixel values are linear, 1.0 = white.
#
# Measured 2026-11-20 on the bench box's NVIDIA GeForce RTX 3070 (Vulkan),
# box job `diffstat` (fixtures tone and vkdt, 512x384 synthetic input, tiles
# of 64 px). `measured_*` hold that run's values; `alone` = the module on the
# CPU's input, `chain` = through the fixture's pipeline.
#
# Not a CI gate yet: these numbers are for that GPU. A gate in CI would run
# on lavapipe and needs its own measurement first.

measured_on = "2026-11-20"
adapter = "NVIDIA GeForce RTX 3070 (DiscreteGpu, Vulkan)"
threshold = 0.00392156862745098
tile = 64

[[module]]
fixture = "tone"
node = "exposure"
module = "exposure"
alone.measured = { max_abs = 0, mean_abs = 0, over = 0, worst_tile = [0, 0, 64, 64] }
alone.budget = { max_abs = 1e-06, mean_abs = 1e-07, over = 0.0 }
chain.measured = { max_abs = 0, mean_abs = 0, over = 0, worst_tile = [0, 0, 64, 64] }
chain.budget = { max_abs = 1e-06, mean_abs = 1e-07, over = 0.0 }

