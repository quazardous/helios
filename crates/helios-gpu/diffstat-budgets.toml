chain.measured = { max_abs = 7.153e-07, mean_abs = 1.523e-07, over = 0, worst_tile = [256, 320, 64, 64] }
chain.budget = { max_abs = 2.9e-06, mean_abs = 6.1e-07, over = 0.0 }

