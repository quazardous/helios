[package]
name = "helios-gpu"
description = "Helios GPU backend on wgpu: runs modules' WGSL variants and checks them against their CPU reference"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
helios-core.workspace = true
# MIT OR Apache-2.0; the version egui 0.36 uses, so the GUI can share the device.
wgpu = "30"
bytemuck = "1"
pollster = "0.4"

# MIT OR Apache-2.0; the Vulkan bindings wgpu-hal 30 uses (already in the
# tree through it), named by the raw Vulkan interop (`vulkan`).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ash = "0.38"

[dev-dependencies]
helios-module-exposure = { path = "../../modules/exposure" }
helios-module-blur = { path = "../../modules/blur" }
helios-module-sigmoid = { path = "../../modules/sigmoid" }
helios-module-vkdt = { path = "../../modules/vkdt" }
helios-testkit.workspace = true
serde_json.workspace = true
# MIT OR Apache-2.0; the shader compiler wgpu 30 uses, to validate every
# WGSL file in a test that needs no GPU.
naga = { version = "30", features = ["wgsl-in"] }

[lints]
workspace = true
