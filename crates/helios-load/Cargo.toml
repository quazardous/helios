[package]
name = "helios-load"
description = "Helios loaders: raw files (through rawler) and pictures read by the framework into graph sources, with camera metadata and embedded previews"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
helios-core.workspace = true
helios-photo.workspace = true
helios-colour.workspace = true
blake3.workspace = true
serde.workspace = true
# LGPL-2.1, compatible with GPL-3.0-or-later.
rawler = { version = "0.8", default-features = false }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "tiff"] }
# MIT OR Apache-2.0, already in the tree through `image`: PNG's cICP, sRGB,
# gAMA and cHRM chunks, which `image` does not expose.
png = "0.18"
# MIT OR Apache-2.0: a JPEG decoder with DCT scaling (1/2, 1/4, 1/8), so a
# large preview is decoded at a fraction of its size.
jpeg-decoder = { version = "0.3", default-features = false }
# MIT OR Unlicense, already in the tree: finding embedded JPEG streams.
memchr = "2"

[dev-dependencies]
helios-export.workspace = true

[lints]
workspace = true
