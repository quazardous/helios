[package]
name = "helios-storage"
description = "Where Helios's files live: the volumes of the machine (disks, cards, shares), their identity, kind and roles, and the registry of those the vault knows"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
helios-vault.workspace = true
blake3.workspace = true
log = "0.4"
serde.workspace = true
serde_json.workspace = true
# MIT: reads the property lists macOS's `diskutil` writes (already in the
# tree through helios-xmp).
quick-xml = "0.42"

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
# Apache-2.0 WITH LLVM-exception OR Apache-2.0 OR MIT: `statvfs` without
# unsafe code (already in the tree through tempfile and others).
rustix = { version = "1", default-features = false, features = ["std", "fs"] }

[target.'cfg(windows)'.dependencies]
# MIT OR Apache-2.0: the Win32 volume API (already in the tree).
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem", "Win32_System_Diagnostics_Debug"] }

[lints]
workspace = true
