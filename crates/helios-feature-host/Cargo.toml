[package]
name = "helios-feature-host"
description = "Test support: runs one Helios feature crate without the desktop (egui-pop's application, the Settings app, Helios's command registry and the feature's contract tables on the bus), drawn headless with egui_kittest"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
egui-pop = { workspace = true, features = ["i18n"] }
# MIT OR Apache-2.0: the feature drawn offscreen and read through
# accesskit.
egui_kittest = "0.37"
helios-shell.workspace = true
helios-i18n.workspace = true
serde_json.workspace = true

[lints]
workspace = true
