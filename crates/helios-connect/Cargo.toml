[package]
name = "helios-connect"
description = "Import connectors: the trait every import source implements (paged listing with a cursor, items, access and fetch), their manifests and registry, and the first two connectors, local folders and mounted cards"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
blake3.workspace = true
md5.workspace = true
sha1.workspace = true
sha2.workspace = true
helios-core.workspace = true
helios-storage.workspace = true
helios-vault.workspace = true
# The EXIF reader the import uses: a card's camera from its first files.
helios-load.workspace = true
serde.workspace = true
serde_json.workspace = true
log = "0.4"
# MIT OR Apache-2.0: the OAuth token requests (rustls), PKCE's base64url and
# its random verifier.
ureq = "3"
base64 = "0.22"
getrandom = "0.3"

[dev-dependencies]
# Already in the tree through helios-load: the test cards' JPEGs.
image = { version = "0.25", default-features = false, features = ["jpeg"] }

[lints]
workspace = true
