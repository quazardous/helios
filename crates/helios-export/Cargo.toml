[package]
name = "helios-export"
description = "Helios exports: render a node, convert it to an output color space, encode it with its colour tags and write it atomically"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
helios-core.workspace = true
helios-photo.workspace = true
helios-colour.workspace = true
serde.workspace = true
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "tiff"] }
# MIT OR Apache-2.0: PNG is written through `png` directly, already in the
# tree through `image`, since `image` cannot write the cICP chunk.
png = "0.18"

[dev-dependencies]
helios-testkit.workspace = true
moxcms = { version = "0.8", default-features = false }

[lints]
workspace = true
