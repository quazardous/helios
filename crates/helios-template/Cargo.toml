[package]
name = "helios-template"
description = "Helios workspace templates: the .helios-template bundle (network, tools, layout, meta), composite files, their schemas, validation and a headless build"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
helios-core.workspace = true
# Workshops' measures: the scopes' luminance counts.
helios-scopes.workspace = true
# MIT: egui-pop's logic without egui (the layout document, panel specs).
egui-pop-model.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
helios-module-exposure = { path = "../../modules/exposure" }
helios-module-masks = { path = "../../modules/masks" }
helios-module-sigmoid = { path = "../../modules/sigmoid" }
# The raw chain, which reads a raw's camera (the Develop template's).
helios-module-rawprepare = { path = "../../modules/rawprepare" }
helios-module-whitebalance = { path = "../../modules/whitebalance" }
helios-module-highlights = { path = "../../modules/highlights" }
helios-module-demosaic = { path = "../../modules/demosaic" }
helios-module-colorin = { path = "../../modules/colorin" }
# A camera's description, for an image source given a raw.
helios-photo.workspace = true

[lints]
workspace = true
