# Clippy settings of the desktop shell. Clippy reads the nearest
# clippy.toml only, so this file repeats the workspace's (../../clippy.toml)
# before the shell's own lists.

# Product names written as words in docs, not code.
doc-valid-idents = ["SQLite", "OpenAI", "JUnit", "ColorChecker", "GretagMacbeth", ".."]

# Helios makes no widgets: the shell draws forms through helios-ui (over
# egui-pop) and visual modules through helios-rack
# (docs/design/ui-responsibilities.md, section 9; the list and its
# replacements in docs/design/visual-identity.md, "Enforcement"). These are
# the raw egui widgets the raw-egui ratchet counted, forbidden once the
# shell drew none of them. Each reason names what to use instead; an
# exception is an `#[expect(clippy::disallowed_methods, reason = "..")]` on
# the one item that needs it. Families that still have callers (widths,
# literal colours, egui-pop's toasts and Library search field) join the
# list in the slice that moves their last caller.
disallowed-methods = [
    { path = "egui::Ui::label", reason = "use egui-pop's text roles (UiPop::text_role, muted, meta)" },
    { path = "egui::Ui::weak", reason = "use UiPop::muted" },
    { path = "egui::Ui::strong", reason = "use UiPop::strong_text" },
    { path = "egui::Ui::small", reason = "use UiPop::meta" },
    { path = "egui::Ui::monospace", reason = "use UiPop::code_text" },
    { path = "egui::Ui::code", reason = "use UiPop::code_text" },
    { path = "egui::Ui::heading", reason = "use helios_ui::section or UiPop::section_title" },
    { path = "egui::Ui::colored_label", reason = "use UiPop::text_tone or helios_ui's states" },
    { path = "egui::Ui::button", reason = "use helios_ui::action" },
    { path = "egui::Ui::small_button", reason = "use helios_ui::action or helios_ui::row_action" },
    { path = "egui::Ui::checkbox", reason = "use egui-pop's widgets::checkbox" },
    { path = "egui::Ui::radio", reason = "use helios_ui::choice or egui-pop's widgets::radio" },
    { path = "egui::Ui::radio_value", reason = "use helios_ui::choice or egui-pop's widgets::radio_value" },
    { path = "egui::Ui::selectable_label", reason = "use helios_ui::choice or egui-pop's widgets" },
    { path = "egui::Ui::selectable_value", reason = "use helios_ui::choice or egui-pop's widgets::selectable_value" },
    { path = "egui::Ui::toggle_value", reason = "use helios_ui::choice or egui-pop's widgets" },
    { path = "egui::Ui::text_edit_singleline", reason = "use helios_ui::search or egui-pop's Input" },
    { path = "egui::Ui::text_edit_multiline", reason = "use egui-pop's Input" },
    { path = "egui::Ui::add_space", reason = "use a gap by intent (UiPop::space_role)" },
    { path = "egui::Ui::separator", reason = "use UiPop::divider" },
    { path = "egui::Ui::spinner", reason = "use helios_ui::loading" },
    { path = "egui::Ui::hyperlink", reason = "use egui-pop's widgets" },
    { path = "egui::Ui::hyperlink_to", reason = "use egui-pop's widgets" },
    { path = "egui::Ui::link", reason = "use helios_ui::action" },
    { path = "egui::Ui::collapsing", reason = "use egui-pop's fold::Fold" },
    { path = "egui::Ui::menu_button", reason = "use egui-pop's menus (declared menus, menus::submenu)" },
    { path = "egui::Response::on_hover_text", reason = "use egui-pop's tip (TooltipExt::tip)" },
    { path = "egui::Response::on_hover_text_at_pointer", reason = "use egui-pop's tip (TooltipExt::tip)" },
    { path = "egui::Response::on_disabled_hover_text", reason = "use egui-pop's disabled tip (TooltipExt::disabled_tip)" },
]
disallowed-types = [
    { path = "egui::Button", reason = "use helios_ui::action" },
    { path = "egui::TextEdit", reason = "use helios_ui::search or egui-pop's Input" },
    { path = "egui::Label", reason = "use egui-pop's text roles (UiPop::text_role)" },
    { path = "egui::Checkbox", reason = "use egui-pop's widgets::checkbox" },
    { path = "egui::RadioButton", reason = "use helios_ui::choice" },
    { path = "egui::ComboBox", reason = "use helios_ui::choice or UiPop::combo_box" },
    { path = "egui::Slider", reason = "use helios-rack (visual modules) or egui-pop's slider" },
    { path = "egui::DragValue", reason = "use egui-pop's NumberInput" },
    { path = "egui::Grid", reason = "use egui-pop's layout grid (UiPop::grid) or helios_ui::details" },
    { path = "egui::RichText", reason = "use egui-pop's text roles (UiPop::text_role, strong_text)" },
    { path = "egui::Frame", reason = "use UiPop::card or egui-pop's surfaces" },
    { path = "egui::Spinner", reason = "use helios_ui::loading" },
    { path = "egui::ProgressBar", reason = "use helios_ui::progress" },
    { path = "egui::CollapsingHeader", reason = "use egui-pop's fold::Fold or helios_ui::section" },
    { path = "egui::Modal", reason = "use egui-pop's overlays (OverlayKind::Modal)" },
    { path = "egui::ScrollArea", reason = "use helios_ui::scroll" },
    { path = "egui::Separator", reason = "use UiPop::divider" },
    { path = "egui::Hyperlink", reason = "use egui-pop's widgets" },
]
