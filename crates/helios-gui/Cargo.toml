[package]
name = "helios-gui"
description = "The Helios desktop: an egui shell (docking, auxiliary windows, palette, keys) over helios-shell, with headless snapshots"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
helios-shell.workspace = true
egui-pop.workspace = true
helios-profile.workspace = true
helios-scopes.workspace = true
helios-values.workspace = true
# MIT OR Apache-2.0.
bytemuck = "1"
helios-core.workspace = true
helios-photo.workspace = true
helios-load.workspace = true
helios-vault.workspace = true
helios-vault-sqlite.workspace = true
# The demo image chain of `helios-gui --image`.
helios-module-exposure = { path = "../../modules/exposure" }
serde.workspace = true
serde_json.workspace = true
# MIT OR Apache-2.0 (egui, eframe, egui_kittest), MIT (egui_dock).
egui = "0.36"
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "wgpu", "wayland", "x11", "accesskit"] }
egui_dock = { version = "0.21", features = ["serde"] }
egui_kittest = { version = "0.36", features = ["eframe", "wgpu"] }
# MIT: the system's file chooser. On Linux through the XDG desktop
# portal (D-Bus, libdbus loaded at run time), without GTK.
rfd = { version = "0.17", default-features = false, features = ["xdg-portal"] }
image = { version = "0.25", default-features = false, features = ["png"] }

[lints]
workspace = true
