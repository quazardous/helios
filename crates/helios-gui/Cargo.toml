[package]
name = "helios-gui"
description = "The Helios desktop: an egui-pop application around docked areas and auxiliary windows, its commands run by Helios's kernel, with headless snapshots"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
helios-shell.workspace = true
# The image viewport (`egui_pop::viewport`) and its tools' steps
# (`egui_pop::imaging`: the histogram, curves, colour wheels and the
# navigator), translations (`egui_pop::i18n`) and the platform services
# (`egui_pop::platform`: the single instance, notifications, logs and
# crash reports) too; the editors (`egui_pop::editors`, MIT: syntect,
# vt100) for the jobs centre's log consoles.
egui-pop = { workspace = true, features = ["viewport", "imaging", "i18n", "views", "editors", "platform-instance", "platform-notify", "platform-logs", "platform-crash"] }
helios-i18n.workspace = true
# A connected node's jobs, followed through its inspect endpoint.
helios-inspect.workspace = true
helios-profile.workspace = true
helios-scopes.workspace = true
helios-values.workspace = true
helios-core.workspace = true
# The process's one GPU device, which the window draws with.
helios-gpu.workspace = true
helios-photo.workspace = true
helios-display.workspace = true
helios-load.workspace = true
# Workspace templates: the built-in ones, a workspace created from one.
helios-template.workspace = true
helios-vault.workspace = true
helios-vault-sqlite.workspace = true
# Import and stack suggestions, as commands.
helios-library.workspace = true
# The demo image chain of `helios-gui --image`.
helios-module-exposure = { path = "../../modules/exposure" }
# The drawn mask shapes the viewport edits (their outlines and handles).
helios-module-masks = { path = "../../modules/masks" }
# MIT OR Apache-2.0: the system's time zone, for the days the library
# shows (already in the tree through rawler).
chrono = { version = "0.4", default-features = false, features = ["clock"] }
serde.workspace = true
serde_json.workspace = true
# MIT OR Apache-2.0: the `log` facade egui-pop's log file reads.
log = "0.4"
# MIT OR Apache-2.0 (egui, eframe, egui_kittest).
egui = "0.36"
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "wgpu", "wayland", "x11", "accesskit"] }
egui_kittest = { version = "0.36", features = ["eframe", "wgpu"] }
image = { version = "0.25", default-features = false, features = ["png"] }

[dev-dependencies]
egui-pop-test.workspace = true
egui-pop-wayland.workspace = true
# An export run as the desktop's job (the jobs centre's tests).
helios-export.workspace = true

[lints]
workspace = true
