[package]
name = "helios-calibrate"
description = "Camera colour calibration from a chart: the charts' reference values and geometry, the patches' sampling areas and their checks, the solver"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
helios-photo.workspace = true
helios-colour.workspace = true
# Colour calibration's own CAT16, so the solve and the render agree.
helios-module-channelmixerrgb = { path = "../../modules/channelmixerrgb" }
serde.workspace = true
# Profiles: their canonical JSON and its hash, the profile id.
serde_json.workspace = true
blake3.workspace = true
# The raw measurement graph: the raw front without `colorin`.
helios-core.workspace = true
# The residual table's layout, shared with the brick that renders it.
helios-bricks.workspace = true
helios-module-rawprepare = { path = "../../modules/rawprepare" }
helios-module-whitebalance = { path = "../../modules/whitebalance" }
helios-module-highlights = { path = "../../modules/highlights" }
helios-module-demosaic = { path = "../../modules/demosaic" }

[dev-dependencies]
# A profile with its residual table rendered as the module renders it.
helios-module-chartprofile = { path = "../../modules/chartprofile" }
# A camera look rendered by its two modules as fitted.
helios-module-cameracolour = { path = "../../modules/cameracolour" }
helios-module-cameratone = { path = "../../modules/cameratone" }
helios-testkit.workspace = true

[lints]
workspace = true
