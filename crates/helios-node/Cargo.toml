[package]
name = "helios-node"
description = "A headless Helios node: loads a network from a JSON description, renders it and serves inspection; plus the `helios` CLI"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
helios-core.workspace = true
helios-inspect.workspace = true
helios-config.workspace = true
helios-export.workspace = true
helios-load.workspace = true
helios-photo.workspace = true
helios-xmp.workspace = true
helios-testkit.workspace = true
helios-decision.workspace = true
helios-resolve.workspace = true
helios-vault.workspace = true
helios-vault-sqlite.workspace = true
helios-module-exposure = { path = "../../modules/exposure" }
helios-module-rawprepare = { path = "../../modules/rawprepare" }
helios-module-demosaic = { path = "../../modules/demosaic" }
helios-module-whitebalance = { path = "../../modules/whitebalance" }
helios-module-highlights = { path = "../../modules/highlights" }
helios-module-colorin = { path = "../../modules/colorin" }
helios-module-sigmoid = { path = "../../modules/sigmoid" }
helios-module-blur = { path = "../../modules/blur" }
helios-module-vkdt = { path = "../../modules/vkdt" }
helios-module-masks = { path = "../../modules/masks" }
serde.workspace = true
serde_json.workspace = true

[target.'cfg(unix)'.dependencies]
# MIT OR Apache-2.0: a safe flag set on Ctrl-C, for `helios batch`.
signal-hook = "0.4"

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

[lints]
workspace = true
