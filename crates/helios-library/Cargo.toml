[package]
name = "helios-library"
description = "Helios library operations: import from folders and cards (copied or referenced, renamed, duplicates found by content), near-duplicate signals, and stack suggestions as decisions"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
helios-config.workspace = true
helios-core.workspace = true
# The folder and card connectors' walk: what a source holds.
helios-connect.workspace = true
helios-decision.workspace = true
# Batch exports planned over library images.
helios-export.workspace = true
helios-load.workspace = true
# Its health checks answer the health report (folder, integrity, pairs).
helios-health.workspace = true
# Volumes, roles and backup strategies: the backup job and safe to format.
helios-storage.workspace = true
# The shared thumbnail cache's re-check (`thumb_check`).
helios-thumbs.workspace = true
helios-vault.workspace = true
helios-xmp.workspace = true
blake3.workspace = true
log = "0.4"
serde.workspace = true
serde_json.workspace = true
# "Move to Trash": the system trash per platform (freedesktop.org on
# Linux and the BSDs, the Recycle Bin, the Finder's Trash). MIT.
# The platform's Pictures folder for the library offered first: the
# Pictures known folder on Windows (OneDrive-redirected included), the XDG
# pictures directory, ~/Pictures on macOS. MIT OR Apache-2.0.
dirs = "6"
trash = { version = "5.3", default-features = false, features = ["coinit_apartmentthreaded", "freedesktop"] }

[dev-dependencies]
egui-pop-model.workspace = true
helios-vault-sqlite.workspace = true
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

[lints]
workspace = true
