[workspace]
resolver = "3"
members = [
    "crates/*",
    "modules/*",
    "plugins/examples/gphoto2-camera",
    "plugins/importers/darktable-library",
    "plugins/importers/lightroom-catalog",
    "plugins/sources/google-photos",
    "xtask",
]
# GUI prototypes build on their own: their dependencies stay out of the
# normal build.
exclude = ["proto"]

[workspace.package]
version = "0.88.0"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/quazardous/helios"

[workspace.dependencies]
helios-ai = { path = "crates/helios-ai" }
helios-core = { path = "crates/helios-core" }
helios-bricks = { path = "crates/helios-bricks" }
helios-testkit = { path = "crates/helios-testkit" }
helios-inspect = { path = "crates/helios-inspect" }
helios-config = { path = "crates/helios-config" }
helios-photo = { path = "crates/helios-photo" }
helios-calibrate = { path = "crates/helios-calibrate" }
helios-export = { path = "crates/helios-export" }
helios-decision = { path = "crates/helios-decision" }
helios-load = { path = "crates/helios-load" }
helios-thumbs = { path = "crates/helios-thumbs" }
helios-xmp = { path = "crates/helios-xmp" }
helios-parity = { path = "crates/helios-parity" }
helios-resolve = { path = "crates/helios-resolve" }
helios-journal = { path = "crates/helios-journal" }
helios-profile = { path = "crates/helios-profile" }
helios-scopes = { path = "crates/helios-scopes" }
helios-vkdt = { path = "crates/helios-vkdt" }
helios-gpu = { path = "crates/helios-gpu" }
helios-compute = { path = "crates/helios-compute" }
helios-shell = { path = "crates/helios-shell" }
helios-plugin = { path = "crates/helios-plugin" }
helios-values = { path = "crates/helios-values" }
helios-gui = { path = "crates/helios-gui" }
helios-vault = { path = "crates/helios-vault" }
helios-vault-sqlite = { path = "crates/helios-vault-sqlite" }
helios-library = { path = "crates/helios-library" }
helios-i18n = { path = "crates/helios-i18n" }
helios-display = { path = "crates/helios-display" }
helios-template = { path = "crates/helios-template" }
helios-colour = { path = "crates/helios-colour" }
helios-storage = { path = "crates/helios-storage" }
helios-connect = { path = "crates/helios-connect" }
helios-health = { path = "crates/helios-health" }
helios-init = { path = "crates/helios-init" }
helios-node-core = { path = "crates/helios-node-core" }
helios-cache = { path = "crates/helios-cache" }
helios-controls = { path = "crates/helios-controls" }
# MIT: the UI library and application framework Helios is built on.
# Its eframe support (the window's place) runs on the same eframe as
# Helios; its icon font stays off. Its bundled font pair (Inter
# and JetBrains Mono NL, SIL Open Font License 1.1) is Helios's interface
# font.
egui-pop = { version = "0.10.2", default-features = false, features = ["eframe", "bundled-fonts"] }
# MIT: egui-pop's agent socket (the debug bridge served to agents out of
# the process), off unless EGUI_POP_AGENT_SOCKET asks for it.
egui-pop-agent = "0.4"
# MIT: egui-pop's translation plugin, alone for the tools (xtask's
# catalogue tasks) that do not build the window's stack.
egui-pop-i18n = "0.9"
# MIT: egui-pop's logic without egui (layouts, panels), for what checks a
# layout without building the window's stack (workspace templates).
egui-pop-model = "0.7"
# MIT: egui-pop's test kit (keymap checks, the accessibility tree).
egui-pop-test = "0.10.1"
# MIT: egui-pop's Wayland layer, for the compositor announcements the
# image surface's tests fake.
egui-pop-wayland = "0.2"
# MIT OR Apache-2.0: the slot layout engine (dense packing of controls in
# standard slot sizes), with no egui dependency.
egui_fit = { version = "0.1", features = ["serde"] }
# MIT OR Apache-2.0: the controls framework (controls as data, cards on the
# slot engine, the value flow, renderers on egui-pop), agnostic of Helios.
egui_hud = "0.3"
blake3 = "1"
# MIT OR Apache-2.0: the hashes connectors claim for their items (MD5,
# SHA-1, SHA-256), checked while fetched bytes land.
md5 = "0.8"
sha1 = "0.10"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[workspace.lints.rust]
# Helios has no use for unsafe code. "deny" rather than "forbid" so a test
# that must call an unsafe std function (setting an environment variable)
# can allow it locally, with a comment saying why.
unsafe_code = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Pixel code converts between integer coordinates, sample counts and float
# values all the time; the ranges are known, so the casts are deliberate.
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
# Image math reads best with the paper's names: x, y, r, g, b, dx, dy.
many_single_char_names = "allow"
similar_names = "allow"
# Exact float comparisons are deliberate: bit-exact pixel tests and
# identity checks such as a scale of exactly 1.0.
float_cmp = "allow"
# Constants copied from darktable and vkdt keep their source spelling, so
# they can be compared with it.
unreadable_literal = "allow"
# Crates are named after their domain (helios-vault's Vault...).
module_name_repetitions = "allow"
# Errors are typed and self-describing; a "# Errors" section on every
# fallible function would repeat them. The same goes for panics, which are
# invariant checks.
missing_errors_doc = "allow"
missing_panics_doc = "allow"
# Pure functions and builders everywhere: marking each one #[must_use]
# adds noise for little gain.
must_use_candidate = "allow"
return_self_not_must_use = "allow"
# Long functions are pipelines and tables (module registries, parameter
# lists); splitting them would scatter one idea.
too_many_lines = "allow"
# Owned arguments are part of the public API shape (handles and messages
# moved into threads or stored); changing them is an API decision.
needless_pass_by_value = "allow"

# egui-pop's next ahead of its crates.io release: settings are app-wide
# unless they opt into a value scope the host declares, dialogs have
# a Copy button and optional technical details, the Settings app
# keeps its values in a store the host provides, and a sensitive text
# setting is typed masked, and the thumbnail grid carries images out
# (drag_out), its agent hovers and secondary-clicks, and the Settings
# app's window draws the main window's
# bars, a number too wide to slide is typed in a spin box, and the agent
# answers a `ui` request on another window while the main one is idle. Every crate of
# the family comes from the same commit, so the graph holds one copy of
# each. Drop this table once a release carries that change.
[patch.crates-io]
egui-pop = { git = "https://github.com/quazardous/egui-pop", rev = "bcb5958f" }
egui-pop-agent = { git = "https://github.com/quazardous/egui-pop", rev = "bcb5958f" }
egui-pop-api = { git = "https://github.com/quazardous/egui-pop", rev = "bcb5958f" }
egui-pop-core = { git = "https://github.com/quazardous/egui-pop", rev = "bcb5958f" }
egui-pop-editors = { git = "https://github.com/quazardous/egui-pop", rev = "bcb5958f" }
egui-pop-i18n = { git = "https://github.com/quazardous/egui-pop", rev = "bcb5958f" }
egui-pop-imaging = { git = "https://github.com/quazardous/egui-pop", rev = "bcb5958f" }
egui-pop-model = { git = "https://github.com/quazardous/egui-pop", rev = "bcb5958f" }
egui-pop-platform = { git = "https://github.com/quazardous/egui-pop", rev = "bcb5958f" }
egui-pop-test = { git = "https://github.com/quazardous/egui-pop", rev = "bcb5958f" }
egui-pop-test-macros = { git = "https://github.com/quazardous/egui-pop", rev = "bcb5958f" }
egui-pop-tokens = { git = "https://github.com/quazardous/egui-pop", rev = "bcb5958f" }
egui-pop-viewport = { git = "https://github.com/quazardous/egui-pop", rev = "bcb5958f" }
egui-pop-views = { git = "https://github.com/quazardous/egui-pop", rev = "bcb5958f" }
egui-pop-wayland = { git = "https://github.com/quazardous/egui-pop", rev = "bcb5958f" }
egui-pop-win32 = { git = "https://github.com/quazardous/egui-pop", rev = "bcb5958f" }

# Decoding raw files in a debug build takes seconds: optimize the decoders
# in every profile, so tests on real raws stay fast.
# Dependencies build without debug info: the GPU and GUI stacks are large,
# and Helios's own crates keep theirs.
[profile.dev.package."*"]
debug = false

[profile.dev.package.rawler]
opt-level = 3

[profile.dev.package.jxl-oxide]
opt-level = 3

# Thumbnails: the JPEG decoders, the scaling and the encoder of the cache
# (`helios-thumbs`), whose tests time their reads.
[profile.dev.package.jpeg-decoder]
opt-level = 3

[profile.dev.package.zune-jpeg]
opt-level = 3

[profile.dev.package.helios-thumbs]
opt-level = 2

# SQLite (the vault's engine), compiled from C: unoptimized, the vault
# tests at the scale of a real library (100,000 photos) spent their time in
# it.
[profile.dev.package.libsqlite3-sys]
opt-level = 3

# The engine samples, scales and caches every pixel a test renders, and the
# test kit makes the noise the contract tests read: unoptimized, they took
# most of the module-contract and viewport test time.
[profile.dev.package.helios-core]
opt-level = 2

[profile.dev.package.helios-testkit]
opt-level = 2

# The blur's contract runs its largest radius over every tile.
[profile.dev.package.helios-module-blur]
opt-level = 2

# The raw chain and the parity harness work on whole sensor images.
[profile.dev.package.helios-module-demosaic]
opt-level = 2

[profile.dev.package.helios-parity]
opt-level = 2

# Mask refinement runs guided filters over every tile in the tests.
[profile.dev.package.helios-module-masks]
opt-level = 2

# A raw export goes through every module of the raw chain, the export's
# colour conversion, and the encoders and the content hash: unoptimized,
# one raw took about 55 s in a debug build, about 9 s with these.
[profile.dev.package.helios-module-rawprepare]
opt-level = 2

[profile.dev.package.helios-module-whitebalance]
opt-level = 2

[profile.dev.package.helios-module-highlights]
opt-level = 2

[profile.dev.package.helios-module-colorin]
opt-level = 2

[profile.dev.package.helios-module-chartprofile]
opt-level = 2

[profile.dev.package.helios-module-cameracolour]
opt-level = 2

[profile.dev.package.helios-module-cameratone]
opt-level = 2

[profile.dev.package.helios-module-flip]
opt-level = 2

[profile.dev.package.helios-module-channelmixerrgb]
opt-level = 2

[profile.dev.package.helios-module-exposure]
opt-level = 2

[profile.dev.package.helios-module-sigmoid]
opt-level = 2

[profile.dev.package.helios-export]
opt-level = 2

[profile.dev.package.helios-photo]
opt-level = 2

[profile.dev.package.image]
opt-level = 3

[profile.dev.package.png]
opt-level = 3

[profile.dev.package.fdeflate]
opt-level = 3

[profile.dev.package.miniz_oxide]
opt-level = 3

[profile.dev.package.crc32fast]
opt-level = 3

[profile.dev.package.simd-adler32]
opt-level = 3

[profile.dev.package.blake3]
opt-level = 3
