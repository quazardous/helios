[workspace]
resolver = "3"
members = ["crates/*", "modules/*"]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/quazardous/darktable-helios"

[workspace.dependencies]
helios-core = { path = "crates/helios-core" }
helios-testkit = { path = "crates/helios-testkit" }
blake3 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
