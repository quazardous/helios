# wbox workspace for the rgbcurve scroll scenario: darktable in a headless
# labwc, same geometry and input preset as the fork's darktable-wbox config
name: rgbcurve-scroll
compositor: labwc
screen: 1600x1000
input_backend: hybrid
headless: true
keyboard_layout: us
clipboard_bridge: false
log:
  dir: ./log
  level: info
screenshot_dir: ./screenshots
timeouts:
  app_render: 5
  stop: 20
app:
  command: ./dt_launch.sh
