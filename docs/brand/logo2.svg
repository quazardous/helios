<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-labelledby="t">
  <title id="t">Helios</title>
  <!-- The Helios diaphragm-sun, every proportion from the golden ratio phi:
       - the sun sits on a golden point of the frame, (S/phi, S - S/phi);
       - the opening's diameter is S / phi^2, the rim and rays its radius / phi^3;
       - the blades are turned by the golden angle, 360 / phi^2;
       - the light's stops fall at 1/phi^4, 1/phi^3, 1/phi^2, 1/phi;
       - a golden spiral, growing by phi each quarter turn, winds into the sun. -->
  <defs>
    <radialGradient id="sun" gradientUnits="userSpaceOnUse" cx="158.22" cy="97.78" r="223.75">
      <stop offset="0.0000" stop-color="#fffbe6"/>
      <stop offset="0.1459" stop-color="#ffe680"/>
      <stop offset="0.2361" stop-color="#ffd23a"/>
      <stop offset="0.3820" stop-color="#ffbe1a"/>
      <stop offset="0.6180" stop-color="#f59f00"/>
      <stop offset="1.0000" stop-color="#e08400"/>
    </radialGradient>
    <clipPath id="frame"><rect width="256" height="256"/></clipPath>
  </defs>
