<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-labelledby="t">
  <title id="t">Helios</title>
  <!-- A stylized iris diaphragm that reads as a sun: the opening is the
       sun's disc, the blades' edges in yellow are its rays, running to the
       edges of the picture. -->
  <defs>
    <radialGradient id="sun" cx="50%" cy="50%" r="60%">
      <stop offset="0" stop-color="#fff3b0"/>
      <stop offset="0.55" stop-color="#ffc21a"/>
      <stop offset="1" stop-color="#f59a00"/>
    </radialGradient>
    <clipPath id="frame"><rect width="256" height="256"/></clipPath>
  </defs>
  <rect width="256" height="256" fill="#17181c"/>
  <g clip-path="url(#frame)" stroke="#f5b400" stroke-width="11" stroke-linecap="butt">
    <line x1="149.0" y1="91.63" x2="300.84" y2="354.62"/>
    <line x1="170.0" y1="128.0" x2="51.76" y2="332.80"/>
    <line x1="149.0" y1="164.37" x2="-89.40" y2="164.37"/>
    <line x1="107.0" y1="164.37" x2="-44.84" y2="-98.62"/>
    <line x1="86.0" y1="128.0" x2="204.24" y2="-76.80"/>
    <line x1="107.0" y1="91.63" x2="345.40" y2="91.63"/>
  </g>
  <path d="M149.00 91.63 L170.00 128.00 L149.00 164.37 L107.00 164.37 L86.00 128.00 L107.00 91.63 Z" fill="url(#sun)" stroke="#f5b400" stroke-width="11" stroke-linejoin="round"/>
</svg>
