<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-labelledby="t">
  <title id="t">Helios</title>
  <!-- The Helios diaphragm-sun, every proportion from the golden ratio phi:
       - the sun sits on a golden point of the frame, (S/phi, S - S/phi);
       - the opening's diameter is S / phi^2, the rim and rays its radius / phi^3;
       - the blades are turned by the golden angle, 360 / phi^2;
       - the light's stops fall at 1/phi^4, 1/phi^3, 1/phi^2, 1/phi;
       - its brightest point is the opening's catchlight, placed as portrait
         photographers place one in an eye: at 10 o'clock, radius / phi^2
         from the centre. -->
  <defs>
    <radialGradient id="sun" gradientUnits="userSpaceOnUse" cx="158.22" cy="97.78" r="223.75" fx="142.05" fy="88.44">
      <stop offset="0.0000" stop-color="#fffbe6"/>
      <stop offset="0.1459" stop-color="#ffe680"/>
      <stop offset="0.2361" stop-color="#ffd23a"/>
      <stop offset="0.3820" stop-color="#ffbe1a"/>
      <stop offset="0.6180" stop-color="#f59f00"/>
      <stop offset="1.0000" stop-color="#e08400"/>
    </radialGradient>
    <clipPath id="frame"><rect width="256" height="256"/></clipPath>
  </defs>
  <rect width="256" height="256" fill="#17181c"/>
  <g clip-path="url(#frame)" stroke="url(#sun)" stroke-width="11.54" stroke-linecap="butt">
    <line x1="122.17" y1="130.81" x2="75.80" y2="-78.49"/>
    <line x1="111.59" y1="83.07" x2="256.69" y2="-49.84"/>
    <line x1="147.64" y1="50.05" x2="321.02" y2="104.74"/>
    <line x1="194.27" y1="64.76" x2="262.06" y2="370.75"/>
    <line x1="204.84" y1="112.49" x2="-45.80" y2="342.11"/>
    <line x1="168.79" y1="145.52" x2="-101.28" y2="60.33"/>
  </g>
  <path d="M122.17 130.81 L111.59 83.07 L147.64 50.05 L194.27 64.76 L204.84 112.49 L168.79 145.52 Z" fill="url(#sun)" stroke="url(#sun)" stroke-width="11.54" stroke-linejoin="round"/>
</svg>
