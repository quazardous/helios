<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-labelledby="t">
  <title id="t">Helios</title>
  <!-- A stylized iris diaphragm that reads as a sun: the opening is the
       sun's disc and the blades' edges its rays, all lit by one light that
       starts at the centre and spreads to the edges of the picture. -->
  <defs>
    <radialGradient id="sun" gradientUnits="userSpaceOnUse" cx="128" cy="128" r="181.02">
      <stop offset="0" stop-color="#fffbe6"/>
      <stop offset="0.140" stop-color="#ffe066"/>
      <stop offset="0.311" stop-color="#ffc21a"/>
      <stop offset="0.656" stop-color="#f7a600"/>
      <stop offset="1" stop-color="#ea8a00"/>
    </radialGradient>
    <clipPath id="frame"><rect width="256" height="256"/></clipPath>
  </defs>
  <rect width="256" height="256" fill="#17181c"/>
  <g clip-path="url(#frame)" stroke="url(#sun)" stroke-width="11" stroke-linecap="butt">
    <line x1="153.41" y1="83.99" x2="312.31" y2="359.21"/>
    <line x1="178.82" y1="128.00" x2="60.58" y2="332.80"/>
    <line x1="153.41" y1="172.01" x2="-92.05" y2="172.01"/>
    <line x1="102.59" y1="172.01" x2="-56.31" y2="-103.21"/>
    <line x1="77.18" y1="128.00" x2="195.42" y2="-76.80"/>
    <line x1="102.59" y1="83.99" x2="348.05" y2="83.99"/>
  </g>
  <path d="M153.41 83.99 L178.82 128.00 L153.41 172.01 L102.59 172.01 L77.18 128.00 L102.59 83.99 Z" fill="url(#sun)" stroke="url(#sun)" stroke-width="11" stroke-linejoin="round"/>
</svg>
