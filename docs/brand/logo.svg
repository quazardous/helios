<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-labelledby="t">
  <title id="t">Helios</title>
  <!-- A stylized iris diaphragm that reads as a sun: the opening is the
       sun's disc and the blades' edges its rays, all lit by one light that
       starts at the centre and spreads to the edges of the picture.
       Proportions follow the golden ratio phi: the opening's diameter is
       the side divided by phi^2, the rim and rays are its radius divided by
       phi^3. -->
  <defs>
    <radialGradient id="sun" gradientUnits="userSpaceOnUse" cx="128" cy="128" r="181.02">
      <stop offset="0" stop-color="#fffbe6"/>
      <stop offset="0.136" stop-color="#ffe066"/>
      <stop offset="0.302" stop-color="#ffc21a"/>
      <stop offset="0.651" stop-color="#f7a600"/>
      <stop offset="1" stop-color="#ea8a00"/>
    </radialGradient>
    <clipPath id="frame"><rect width="256" height="256"/></clipPath>
  </defs>
  <rect width="256" height="256" fill="#17181c"/>
  <g clip-path="url(#frame)" stroke="url(#sun)" stroke-width="11.54" stroke-linecap="butt">
    <line x1="152.45" y1="85.66" x2="309.80" y2="358.20"/>
    <line x1="176.89" y1="128.00" x2="58.65" y2="332.80"/>
    <line x1="152.45" y1="170.34" x2="-91.47" y2="170.34"/>
    <line x1="103.55" y1="170.34" x2="-53.80" y2="-102.20"/>
    <line x1="79.11" y1="128.00" x2="197.35" y2="-76.80"/>
    <line x1="103.55" y1="85.66" x2="347.47" y2="85.66"/>
  </g>
  <path d="M152.45 85.66 L176.89 128.00 L152.45 170.34 L103.55 170.34 L79.11 128.00 L103.55 85.66 Z" fill="url(#sun)" stroke="url(#sun)" stroke-width="11.54" stroke-linejoin="round"/>
</svg>
