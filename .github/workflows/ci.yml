name: ci

on:
  push:
    # `next` is the buffer branch agents merge into; once this workflow
    # passes there, promote.yml releases that commit's fragments and
    # fast-forwards `main` (docs/releases.md). Its "Release X.Y.Z" commit
    # and merges are pushed with GITHUB_TOKEN, so they start no run here:
    # they only bump versions, and the next push tests them.
    branches: [main, next]
  # Pull requests: only a contributor's, from a fork (see each job's `if`).
  pull_request:

# One run per branch at a time. A run on `next` is never cancelled: next
# moves faster than a full run lasts, so cancelling meant no run ever
# finished and main was never promoted (2026-11-08). The run going finishes;
# the newest push waits behind it (GitHub keeps only the latest pending
# one), so main is promoted at least once per run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    # Our own pull requests (branches of this repository) run no CI: they
    # are tested on the bench box and merged into next, whose push run is
    # the one that counts. A contributor's pull request from a fork runs
    # everything.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    # Pinned, not ubuntu-latest: the fallback Mesa build links this
    # image's LLVM 22 (see .github/actions/software-vulkan).
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.95
        with:
          components: clippy, rustfmt
      # Shared with the commits job: the dependencies are built once.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # vkdt's module files, read by the manifest round-trip test (never
      # copied into Helios), at the commit the converter was checked on.
      - name: vkdt checkout
        run: |
          git init -q vkdt && cd vkdt
          git fetch -q --depth 1 https://github.com/hanatos/vkdt.git afc34256fb22bcaf6dcf6503d19d5f9a6f477af5
          git checkout -q FETCH_HEAD
          echo "VKDT_SRC=$PWD" >> "$GITHUB_ENV"
      # No GPU in CI: lavapipe, Mesa's software Vulkan, runs the GPU
      # backend's tests against the CPU reference. Ubuntu's archive first,
      # a GitHub-hosted Mesa build when the archive is down, or at once when
      # the repository variable UBUNTU_ARCHIVE_DOWN is `true` (docs/bench.md,
      # "When Ubuntu's archive is down").
      - name: software Vulkan
        uses: ./.github/actions/software-vulkan
        with:
          apt: ${{ vars.UBUNTU_ARCHIVE_DOWN != 'true' }}
      # One process per test, a JUnit report, slow tests named
      # (.config/nextest.toml); nextest does not run doctests.
      - run: cargo nextest run --workspace --profile ci
      - run: cargo test --workspace --doc
      # Quit, kill -9 and reopen: the scenarios that gate a release, by name.
      # promote.yml releases this very commit without running them again.
      - name: survival scenarios
        run: cargo survival
      - name: slowest tests
        if: ${{ !cancelled() }}
        run: cargo xtask test-times --from-junit target/nextest/ci/junit.xml --summary >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: junit
          path: target/nextest/ci/junit.xml
      # Say which GPU adapter the backend tests ran on (or that they skipped).
      - name: GPU adapter
        run: cargo test -q -p helios-gpu --test backend -- --nocapture 2>&1 | grep -E "^(GPU|skipped):" | sort -u
      - name: changelog fragments, plugin ranges and Cargo.lock
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            cargo xtask check --base "origin/${{ github.base_ref }}"
          else
            cargo xtask check
          fi

  # The workspace on Windows (MSVC): it builds, and its tests run. No GPU
  # on the runner: the GPU tests run on WARP (DX12 in software).
  windows:
    # Our own pull requests (branches of this repository) run no CI: they
    # are tested on the bench box and merged into next, whose push run is
    # the one that counts. A contributor's pull request from a fork runs
    # everything.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      # Text fixtures (JSON, TOML, catalogues) are compared byte for byte:
      # check them out as they are committed, with LF.
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows
          # A failing test must not cost the next run a full build.
          cache-on-failure: true
      - run: cargo build --locked --workspace --all-targets
      # Not required yet: 22 test targets fail on Windows, listed in
      # docs/windows-port.md ("Where it stands"). The step still runs and
      # shows red, so a new failure is seen; the build above is required.
      - run: cargo test --locked --workspace --no-fail-fast
        continue-on-error: true

  # Every commit of the push or pull request but its head (the test job
  # gates the head) builds, passes clippy and the tests it touches (the
  # critical set included), so bisecting keeps working:
  # `cargo xtask check-commits`, capped at 20 commits, stops at the first
  # broken one and names it in the job summary, with what each commit ran.
  commits:
    # Our own pull requests (branches of this repository) run no CI: they
    # are tested on the bench box and merged into next, whose push run is
    # the one that counts. A contributor's pull request from a fork runs
    # everything.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.95
        with:
          components: clippy
      # The critical set runs desktop tests (persist, survival): the same
      # software Vulkan as the test job, so they see the same machine.
      - name: software Vulkan
        uses: ./.github/actions/software-vulkan
        with:
          apt: ${{ vars.UBUNTU_ARCHIVE_DOWN != 'true' }}
      # The test job saves this cache; this job only reads it.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace
          save-if: false
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      # A pull request walks its base..head (not the merge commit checked
      # out), a push its before..after. A null or unknown base (a first or
      # forced push) falls back to the merge base with origin/main.
      - name: check each commit
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        # A push to next walks only its first-parent commits (each merge):
        # a pull request's own fix-up commits are not walked one by one
        # (owner, 2026-11-13). A fork's pull request walks all its commits.
        run: |
          if [ "${{ github.event_name }}" = push ]; then
            cargo xtask check-commits --first-parent "${BASE:-0}..$HEAD"
          else
            cargo xtask check-commits "${BASE:-0}..$HEAD"
          fi

  # The controls gallery builds for wasm32: its pages stay web-ready.
  gallery-web:
    # Our own pull requests (branches of this repository) run no CI: they
    # are tested on the bench box and merged into next, whose push run is
    # the one that counts. A contributor's pull request from a fork runs
    # everything.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95
        with:
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: wasm
      # The toolchain rust-toolchain.toml pins is not the one the action
      # named: add the target to it.
      - run: rustup target add wasm32-unknown-unknown
      - run: cargo clippy --locked --target wasm32-unknown-unknown -p helios-controls-gallery -- -D warnings

  # Every linter of `cargo xtask lint`, installed so none is skipped:
  # rustfmt, clippy, cargo-deny, cargo-machete, taplo, typos, shellcheck, ruff.
  lint:
    # Our own pull requests (branches of this repository) run no CI: they
    # are tested on the bench box and merged into next, whose push run is
    # the one that counts. A contributor's pull request from a fork runs
    # everything.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95
        with:
          components: clippy, rustfmt
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny,cargo-machete,taplo,typos
      - name: shellcheck and ruff
        run: |
          # The runner image ships shellcheck: apt only if it ever stops.
          command -v shellcheck || { sudo apt-get -o Acquire::Retries=5 update -q && sudo apt-get -o Acquire::Retries=5 install -yq shellcheck; }
          pipx install ruff
      - run: cargo xtask lint --require-all
