name: ci

on:
  push:
    # `next` is the buffer branch agents merge into; once this workflow
    # passes there, promote.yml releases that commit's fragments and
    # fast-forwards `main` (docs/releases.md). Its "Release X.Y.Z" commit
    # and merges are pushed with GITHUB_TOKEN, so they start no run here:
    # they only bump versions, and the next push tests them.
    branches: [main, next]
  # Pull requests: only a contributor's, from a fork (see each job's `if`).
  # Our own run pr-lint.yml, the cheap checks alone.
  pull_request:
  # The whole suite on `next`, nightly and on demand (docs/ci-broker.md,
  # "On next"): a push to `next` runs the CI broker's selection, and only a
  # full run promotes (promote.yml). Scheduled runs use the default
  # branch's copy of this file; the test job checks out `next` itself, and
  # a scheduled run skips a `next` a scheduled run already tested.
  schedule:
    - cron: "15 1 * * *"
  workflow_dispatch:

# One run per branch at a time. A run on `next` is never cancelled: next
# moves faster than a full run lasts, so cancelling meant no run ever
# finished and main was never promoted (2026-11-08). The run going finishes;
# the newest push waits behind it (GitHub keeps only the latest pending
# one), so main is promoted at least once per run.
# The nightly and manual runs test `next` whatever ref they start from:
# one group of their own.
concurrency:
  group: ci-${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'next-full' || github.ref }}
  cancel-in-progress: false

jobs:
  # A scheduled run tests a `next` no scheduled run tested yet, or nothing,
  # as windows-tests.yml does: a cache entry `ci-full-tested-<sha>`, saved
  # by `mark` once a scheduled run tested that commit, pass or fail. Found:
  # `test` is skipped and the run is not red. Any doubt runs the tests.
  gate:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.decide.outputs.run }}
      sha: ${{ steps.next.outputs.sha }}
    steps:
      - name: next's head
        id: next
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/next" --jq .sha) || sha=
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - name: was it tested?
        id: tested
        if: steps.next.outputs.sha != ''
        uses: actions/cache/restore@v4
        with:
          path: tested-sha
          key: ci-full-tested-${{ steps.next.outputs.sha }}
          lookup-only: true
      - name: decide
        id: decide
        env:
          SHA: ${{ steps.next.outputs.sha }}
          HIT: ${{ steps.tested.outputs.cache-hit }}
        run: |
          if [ -n "$SHA" ] && [ "$HIT" = true ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "skipped: next unchanged since the full run of $SHA" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "run: next at ${SHA:-an unknown head} not fully tested by a nightly run yet" >> "$GITHUB_STEP_SUMMARY"
          fi

  test:
    needs: gate
    # Our own pull requests (branches of this repository) run none of this,
    # only their cheap checks (pr-lint.yml): they
    # are tested on the bench box and merged into next, whose push run is
    # the one that counts. A contributor's pull request from a fork runs
    # everything. Runs unless the gate said no (it runs on schedule only; a
    # failed gate has no output, so it fails open).
    if: ${{ !cancelled() && needs.gate.outputs.run != 'false' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository) }}
    permissions:
      contents: read
      # earlier runs' `junit` artifacts, for the broker's recent failures
      actions: read
    # Pinned, not ubuntu-latest: the fallback Mesa build links this
    # image's LLVM 22 (see .github/actions/software-vulkan).
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # A nightly or manual run tests `next` (the commit the gate saw).
          ref: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && (needs.gate.outputs.sha || 'next') || '' }}
      - uses: dtolnay/rust-toolchain@1.95
        with:
          components: clippy, rustfmt
      # Shared with the commits job: the dependencies are built once.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # vkdt's module files, read by the manifest round-trip test (never
      # copied into Helios), at the commit the converter was checked on.
      - name: vkdt checkout
        run: |
          git init -q vkdt && cd vkdt
          git fetch -q --depth 1 https://github.com/hanatos/vkdt.git afc34256fb22bcaf6dcf6503d19d5f9a6f477af5
          git checkout -q FETCH_HEAD
          echo "VKDT_SRC=$PWD" >> "$GITHUB_ENV"
      # No GPU in CI: lavapipe, Mesa's software Vulkan, runs the GPU
      # backend's tests against the CPU reference. Ubuntu's archive first,
      # a GitHub-hosted Mesa build when the archive is down, or at once when
      # the repository variable UBUNTU_ARCHIVE_DOWN is `true` (docs/bench.md,
      # "When Ubuntu's archive is down").
      - name: software Vulkan
        uses: ./.github/actions/software-vulkan
        with:
          apt: ${{ vars.UBUNTU_ARCHIVE_DOWN != 'true' }}
      # The whole suite, or the CI broker's selection (docs/ci-broker.md,
      # "On next"). A push to `next` runs the selection since the push's
      # previous commit. Everything runs on the nightly and manual runs, on
      # other pushes and pull requests, when a pushed commit carries the
      # trailer `CI: full`, and on any doubt: no previous commit, the
      # tests do not list, the broker fails or selects everything. The
      # tests that failed in runs the nightly history has not folded yet
      # come in too: `next`'s last pushes and its last nightly run.
      - name: full suite or selection
        id: mode
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE: ${{ github.event.before }}
        run: |
          full() {
            echo "mode=full" >> "$GITHUB_OUTPUT"
            echo "filter=all()" >> "$GITHUB_OUTPUT"
            echo "**Every test runs**: $1." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          }
          if [ "$GITHUB_EVENT_NAME" != push ] || [ "$GITHUB_REF" != refs/heads/next ]; then
            full "a $GITHUB_EVENT_NAME run, not a push to next"
          fi
          if [ -z "$BEFORE" ] || [ "$BEFORE" = 0000000000000000000000000000000000000000 ] \
            || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            full "no previous commit of next to compare with (a first or forced push)"
          fi
          if grep -qiE '^CI: *full[[:space:]]*$' <<< "$(git log --format=%B "$BEFORE..HEAD")"; then
            full "a pushed commit carries the trailer \`CI: full\`"
          fi
          {
            gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --branch next --event push \
              --status completed --limit 3 --json databaseId --jq '.[].databaseId'
            gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --event schedule \
              --status completed --limit 1 --json databaseId --jq '.[].databaseId'
          } 2>/dev/null | while read -r id; do
            gh run download "$id" --repo "$GITHUB_REPOSITORY" --name junit \
              --dir "failed/run-$id" 2>/dev/null || true
          done || true
          failed=()
          while IFS= read -r -d '' f; do failed+=(--failed-junit "$f"); done \
            < <(find failed -name '*.xml' -print0 2>/dev/null)
          cargo nextest list --workspace --message-format oneline > tests.txt \
            || full "the tests do not list"
          filter=$(cargo xtask ci-broker select --base "$BEFORE" --committed "${failed[@]}" \
            --list tests.txt --summary-md broker-summary.md) \
            || full "the broker failed (see the step \"full suite or selection\")"
          if [ -z "$filter" ] || [ "$filter" = 'all()' ]; then
            cat broker-summary.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
            full "the broker selected everything"
          fi
          cat broker-summary.md >> "$GITHUB_STEP_SUMMARY"
          echo "mode=select" >> "$GITHUB_OUTPUT"
          echo "filter=$filter" >> "$GITHUB_OUTPUT"
      # What this run tests, read by promote.yml (only a full run promotes)
      # and by ci-history.yml (a nightly run's commit is next's, not its
      # own head_sha): keep the name `ci-run`.
      - name: what this run tests
        env:
          MODE: ${{ steps.mode.outputs.mode }}
        run: |
          printf '{"format":1,"mode":"%s","commit":"%s","event":"%s"}\n' \
            "${MODE:-full}" "$(git rev-parse HEAD)" "$GITHUB_EVENT_NAME" > ci-run.json
          cat ci-run.json
      - uses: actions/upload-artifact@v4
        with:
          name: ci-run
          path: ci-run.json
      # One process per test, a JUnit report, slow tests named
      # (.config/nextest.toml); nextest does not run doctests.
      - name: tests
        env:
          FILTER: ${{ steps.mode.outputs.filter || 'all()' }}
        run: cargo nextest run --workspace --profile ci -E "$FILTER"
      - run: cargo test --workspace --doc
      # Quit, kill -9 and reopen: the scenarios that gate a release, by name.
      # promote.yml releases this very commit without running them again
      # (a full run only). A selective run has them in its smoke set.
      - name: survival scenarios
        if: steps.mode.outputs.mode != 'select'
        run: cargo survival
      - name: slowest tests
        if: ${{ !cancelled() }}
        run: cargo xtask test-times --from-junit target/nextest/ci/junit.xml --summary >> "$GITHUB_STEP_SUMMARY"
      # Read nightly by ci-history.yml (the per-test history, docs/ci-broker.md):
      # keep the name `junit`, and upload it from failed runs too.
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: junit
          path: target/nextest/ci/junit.xml
      # The broker's shadow (docs/ci-broker.md, "Shadow week"): which of the
      # tests above `ci-broker select` chose, since the push's previous
      # commit. It skips nothing and never fails the job;
      # xtask is already built (by "slowest tests"), so it costs seconds.
      # ci-history.yml reads the `broker-shadow` artifact nightly.
      - name: broker shadow
        id: broker-shadow
        if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/next' }}
        continue-on-error: true
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [ -z "$BEFORE" ] || [ "$BEFORE" = 0000000000000000000000000000000000000000 ] \
            || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            echo "no previous commit to compare with (a first or forced push): no shadow"
            exit 0
          fi
          cargo xtask ci-broker select --base "$BEFORE" --committed \
            --shadow broker-shadow.json --run "$GITHUB_RUN_ID" --commit "$GITHUB_SHA" \
            --junit target/nextest/ci/junit.xml > /dev/null
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && steps.broker-shadow.outcome == 'success' }}
        continue-on-error: true
        with:
          name: broker-shadow
          path: broker-shadow.json
          if-no-files-found: ignore
      # Say which GPU adapter the backend tests ran on (or that they skipped).
      - name: GPU adapter
        run: cargo test -q -p helios-gpu --test backend -- --nocapture 2>&1 | grep -E "^(GPU|skipped):" | sort -u
      # Each module's GPU output against its CPU path on lavapipe, against
      # lavapipe's budgets in crates/helios-gpu/diffstat-budgets.toml: a
      # module over its budget, or a GPU kernel that fell back to the CPU,
      # fails the job, named. The dev profile reuses what the tests built.
      - name: GPU against CPU, per module (diffstat)
        run: cargo xtask engine-diffstat all --budgets --dev
      - name: changelog fragments, plugin ranges and Cargo.lock
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            cargo xtask check --base "origin/${{ github.base_ref }}"
          else
            cargo xtask check
          fi

  # A scheduled run marks the commit it tested, pass or fail: the next
  # night skips it unless `next` moved (as windows-tests.yml does).
  mark:
    needs: [gate, test]
    if: ${{ !cancelled() && needs.gate.outputs.sha != '' && (needs.test.result == 'success' || needs.test.result == 'failure') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: echo "$SHA" > tested-sha
        env:
          SHA: ${{ needs.gate.outputs.sha }}
      - uses: actions/cache/save@v4
        with:
          path: tested-sha
          key: ci-full-tested-${{ needs.gate.outputs.sha }}

  # The workspace builds on Windows (MSVC), every push. Its tests run
  # nightly and on demand instead (windows-tests.yml): they took 20 of this
  # job's 33 minutes, made it the run's slowest path, and blocked nothing.
  windows:
    # Our own pull requests (branches of this repository) run none of this,
    # only their cheap checks (pr-lint.yml): they
    # are tested on the bench box and merged into next, whose push run is
    # the one that counts. A contributor's pull request from a fork runs
    # everything.
    # The nightly and manual runs are the test job's alone.
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository)
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      # Text fixtures (JSON, TOML, catalogues) are compared byte for byte:
      # check them out as they are committed, with LF.
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows
          # A failing build must not cost the next run a full build.
          cache-on-failure: true
      - run: cargo build --locked --workspace --all-targets

  # Every commit of the push or pull request but its head (the test job
  # gates the head) builds, passes clippy and the tests it touches (the
  # critical set included), so bisecting keeps working:
  # `cargo xtask check-commits`, capped at 20 commits, stops at the first
  # broken one and names it in the job summary, with what each commit ran.
  commits:
    # Our own pull requests (branches of this repository) run none of this,
    # only their cheap checks (pr-lint.yml): they
    # are tested on the bench box and merged into next, whose push run is
    # the one that counts. A contributor's pull request from a fork runs
    # everything.
    # The nightly and manual runs are the test job's alone.
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository)
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.95
        with:
          components: clippy
      # The critical set runs desktop tests (persist, survival): the same
      # software Vulkan as the test job, so they see the same machine.
      - name: software Vulkan
        uses: ./.github/actions/software-vulkan
        with:
          apt: ${{ vars.UBUNTU_ARCHIVE_DOWN != 'true' }}
      # The test job saves this cache; this job only reads it.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace
          save-if: false
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      # A pull request walks its base..head (not the merge commit checked
      # out), a push its before..after. A null or unknown base (a first or
      # forced push) falls back to the merge base with origin/main.
      - name: check each commit
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        # A push to next walks only its first-parent commits (each merge):
        # a pull request's own fix-up commits are not walked one by one
        # (owner, 2026-11-13). A fork's pull request walks all its commits.
        run: |
          if [ "${{ github.event_name }}" = push ]; then
            cargo xtask check-commits --first-parent "${BASE:-0}..$HEAD"
          else
            cargo xtask check-commits "${BASE:-0}..$HEAD"
          fi

  # The controls gallery builds for wasm32: its pages stay web-ready.
  gallery-web:
    # Our own pull requests (branches of this repository) run none of this,
    # only their cheap checks (pr-lint.yml): they
    # are tested on the bench box and merged into next, whose push run is
    # the one that counts. A contributor's pull request from a fork runs
    # everything.
    # The nightly and manual runs are the test job's alone.
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95
        with:
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: wasm
      # The toolchain rust-toolchain.toml pins is not the one the action
      # named: add the target to it.
      - run: rustup target add wasm32-unknown-unknown
      - run: cargo clippy --locked --target wasm32-unknown-unknown -p helios-controls-gallery -- -D warnings

  # Every cheap check, none building a test (.github/actions/lint): `cargo
  # xtask lint` with every linter installed (rustfmt, clippy, deps-worlds,
  # cargo-deny, cargo-machete, taplo, typos, shellcheck, ruff), the
  # documentation without a warning, the UI index, the catalogues.
  lint:
    # Our own pull requests (branches of this repository) run these same
    # steps as their one check, `pr-lint` (pr-lint.yml), and nothing else:
    # they are tested on the bench box and merged into next, whose push run
    # is the one that counts. A contributor's pull request from a fork runs
    # everything.
    # The nightly and manual runs are the test job's alone.
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95
        with:
          components: clippy, rustfmt
      - uses: ./.github/actions/lint
