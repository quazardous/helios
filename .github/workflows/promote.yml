name: Promote next to main

# `next` is the buffer branch agents merge into (docs/bench.md, "The next
# branch"). Once CI passes on a push to `next`, `main` moves to that exact
# commit, with its release (docs/releases.md):
#
# - The promotion works on the commit CI validated, the run's `head_sha`,
#   never on whatever `next` points to by then. A commit CI did not test
#   never reaches `main`.
# - When a fragment in `changelog.d/` asks for a release (`release: patch`,
#   `minor` or `major`), or a user-facing one has waited 7 days,
#   `cargo xtask promote` commits "Release X.Y.Z" on top of that commit
#   (the CHANGELOG section of every pending fragment, the version they
#   decide, Cargo.lock), as the bot. Otherwise the commit alone is
#   promoted and the fragments wait.
# - The survival scenarios are not run again: CI ran them on that commit,
#   in its test job, and the release commit changes no code.
# - The release commit must differ from the validated commit by a version
#   bump only (versions, CHANGELOG, metainfo, fragments removed, and in
#   Cargo.lock only the workspace's own versions); anything more, a stale
#   Cargo.lock say, stops the promotion before any push.
# - `main` fast-forwards to it; `next` too, in the same atomic push, if it
#   still points at that commit (a lease). If `next` has moved, the
#   release is merged into it by a merge commit, never rewritten; the
#   promotion of the newer commit then builds on that merge.
# - Pushes made with GITHUB_TOKEN start no workflow: the release commit and
#   the merge do not rerun CI. The next push to `next` tests them, with
#   whatever lands next.
# - A release made here is tagged `vX.Y.Z` here, and release.yml is started
#   by a dispatch with `publish` (a tag pushed with GITHUB_TOKEN starts no
#   workflow, a dispatch does): no hand step between a fragment asking for
#   a release and the GitHub Release.
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [next]

permissions:
  contents: write
  # to start release.yml
  actions: write

concurrency:
  group: promote
  cancel-in-progress: false

jobs:
  promote:
    name: Release and fast-forward main
    if: github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.95
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: promote
      - name: Bot identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Where main stands before
        id: before
        run: echo "main=$(git rev-parse origin/main)" >> "$GITHUB_OUTPUT"
      - name: Release and promote the commit CI passed
        id: promote
        env:
          SHA: ${{ github.event.workflow_run.head_sha }}
        # --locked: a stale Cargo.lock fails here, before anything is written.
        run: cargo --locked xtask promote "$SHA"
      - name: Tag and publish the release
        if: steps.promote.outputs.release != ''
        env:
          VERSION: ${{ steps.promote.outputs.release }}
          COMMIT: ${{ steps.promote.outputs.commit }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag "v$VERSION" "$COMMIT"
          git push origin "v$VERSION"
          gh workflow run release.yml -R "$GITHUB_REPOSITORY" --ref main \
            -f tag="v$VERSION" -f publish=true
          echo "tagged v$VERSION and started its release" >> "$GITHUB_STEP_SUMMARY"
      # A push with GITHUB_TOKEN starts no workflow, so pages.yml (on a push
      # to main touching site/) is started here when the promotion brought
      # changes to the site.
      - name: Publish the site when it changed
        env:
          BEFORE: ${{ steps.before.outputs.main }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch -q origin main
          if ! git diff --quiet "$BEFORE" origin/main -- site .github/workflows/pages.yml; then
            gh workflow run pages.yml -R "$GITHUB_REPOSITORY" --ref main
            echo "the site changed: pages.yml started" >> "$GITHUB_STEP_SUMMARY"
          fi
