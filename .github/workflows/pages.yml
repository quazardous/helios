name: Pages

# Builds egui_hud's web demo (crates/egui_hud_demo) with Trunk and deploys
# it to GitHub Pages under /egui_hud/, the site's root sending there.
# main only moves when promote.yml fast-forwards it to a commit CI passed
# on next; a push made with the workflow token starts no workflow, so this
# one follows the promotion's run. Run by hand on another branch, it builds
# without deploying.
on:
  workflow_run:
    workflows: [Promote next to main]
    types: [completed]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # After a promotion, main as it now is.
          ref: ${{ github.event_name == 'workflow_run' && 'main' || github.ref }}
      - uses: dtolnay/rust-toolchain@1.95
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: wasm
          save-if: false
      - uses: taiki-e/install-action@v2
        with:
          tool: trunk
      # The toolchain rust-toolchain.toml pins is not the one the action
      # named: add the target to it.
      - run: rustup target add wasm32-unknown-unknown
      - name: Build the demo
        working-directory: crates/egui_hud_demo
        run: trunk build --release --public-url /${{ github.event.repository.name }}/egui_hud/
      - name: Lay out the site
        run: |
          mkdir -p site
          cp -r crates/egui_hud_demo/dist site/egui_hud
          cat > site/index.html <<'HTML'
          <!doctype html>
          <html lang="en">
            <head>
              <meta charset="utf-8" />
              <title>Helios</title>
              <meta http-equiv="refresh" content="0; url=egui_hud/" />
            </head>
            <body><p><a href="egui_hud/">egui_hud demo</a></p></body>
          </html>
          HTML
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    if: github.event_name == 'workflow_run' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
