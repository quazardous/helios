name: release

# Builds the Linux and Windows packages of a version and publishes them as a GitHub
# Release (docs/releases.md); a first macOS build runs too, its files kept
# as the run's artefacts only. Versions advance on their own with each
# promotion of `next` (promote.yml); a version is published only when the
# coordinator tags its "Release X.Y.Z" commit on `main` as `vX.Y.Z`, by
# judgment (a real feature or a serious fix). No workflow pushes tags.
# Runs on a `vX.Y.Z` tag pushed, or by hand:
# with `publish: false` (the default by hand) it only builds, tests and
# keeps the files as the run's artefacts, without creating a Release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "The tag to build, vX.Y.Z (any name for a dry run)"
        required: true
        type: string
      publish:
        description: "Create the GitHub Release (the tag must exist on main)"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  TAG: ${{ inputs.tag || github.ref_name }}
  # A tag pushed always publishes; by hand, only when asked.
  PUBLISH: ${{ (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || inputs.publish == true }}
  CARGO_TERM_COLOR: never

jobs:
  # The binaries in release, on the oldest glibc GitHub offers (Ubuntu
  # 22.04, glibc 2.35), so they run on that and on anything newer.
  build-linux:
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Publishing builds the tag itself; a dry run builds the branch
          # the workflow was started from.
          ref: ${{ env.PUBLISH == 'true' && env.TAG || '' }}
      - name: version
        id: version
        run: |
          version="${TAG#v}"
          cargo_version="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n1)"
          echo "tag $TAG, version $version, Cargo.toml $cargo_version"
          if [ "$PUBLISH" = "true" ] && [ "$version" != "$cargo_version" ]; then
            echo "::error::the tag $TAG does not match the workspace version $cargo_version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "cargo_version=$cargo_version" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@1.95
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-linux
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      # helios (the command line), helios-node and helios-mcp (which
      # helios starts), helios-gui (the window) and the programs of the
      # plugins Helios ships. Their runtime data (catalogues, templates,
      # module declarations, the plugins' manifests) is compiled in.
      - name: build
        run: |
          cargo build --release --locked \
            -p helios-node -p helios-gui -p helios-plugin-darktable-library \
            -p helios-plugin-lightroom-catalog
      - name: package
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: packaging/linux/release.sh "$VERSION" target/release dist
      # The CHANGELOG.md section of the version: the Release's notes. A dry
      # run takes the workspace version's section, so the cut is tested too.
      - name: release notes
        env:
          NOTES_VERSION: ${{ env.PUBLISH == 'true' && steps.version.outputs.version || steps.version.outputs.cargo_version }}
        run: |
          awk -v v="$NOTES_VERSION" '
            index($0, "## [" v "]") == 1 { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > dist/release-notes.md
          if ! grep -q '[^[:space:]]' dist/release-notes.md; then
            echo "::error::no section for $NOTES_VERSION in CHANGELOG.md"
            exit 1
          fi
          cat dist/release-notes.md
      - uses: actions/upload-artifact@v4
        with:
          name: helios-${{ steps.version.outputs.version }}-linux-x86_64
          path: dist/
          if-no-files-found: error

  # The packages as a user gets them: in a bare Ubuntu 22.04 container (no
  # Vulkan loader, no GPU, no desktop libraries), the tarball's command line
  # imports a picture and exports it; the AppImage starts and says its
  # version on the runner.
  smoke-linux:
    needs: build-linux
    runs-on: ubuntu-22.04
    env:
      VERSION: ${{ needs.build-linux.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.PUBLISH == 'true' && env.TAG || '' }}
      - uses: actions/download-artifact@v4
        with:
          name: helios-${{ needs.build-linux.outputs.version }}-linux-x86_64
          path: dist
      - name: checksums
        working-directory: dist
        run: sha256sum -c SHA256SUMS
      - name: tarball, command line, no Vulkan
        run: |
          docker run --rm -v "$PWD:/work:ro" -e VERSION ubuntu:22.04 \
            bash /work/packaging/linux/smoke.sh "/work/dist/helios-$VERSION-linux-x86_64.tar.gz" \
              /work/crates/helios-plugin/tests/fixtures/rated-photos/a.jpg
      - name: AppImage
        run: |
          app="dist/Helios-$VERSION-x86_64.AppImage"
          chmod +x "$app"
          # No FUSE needed: the runtime extracts itself and runs.
          export APPIMAGE_EXTRACT_AND_RUN=1
          "$app" --version | tee gui.txt
          grep -q '^helios-gui [0-9]' gui.txt
          "$app" helios --version | tee cli.txt
          grep -q '^helios [0-9]' cli.txt

  # The Flatpak, built from source with no network inside the build
  # (packaging/flatpak/build.sh), as a single-file bundle, then installed
  # and smoke-tested as a user gets it. It runs in Flathub's builder image
  # (flatpak, flatpak-builder, bubblewrap, appstreamcli and the cargo
  # generator's Python modules, from the org.flatpak.Builder Flatpak),
  # privileged so bubblewrap can sandbox each build step: no apt, so an
  # outage of Ubuntu's archive (UBUNTU_ARCHIVE_DOWN, docs/bench.md) does
  # not touch it, and no AppArmor user-namespace restriction to lift.
  flatpak:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    container:
      # Its tag follows the manifest's runtime-version.
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-26.08
      options: --privileged
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.PUBLISH == 'true' && env.TAG || '' }}
      - name: version
        id: version
        run: echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
      - name: build
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          packaging/flatpak/build.sh all "$VERSION" dist "$RUNNER_TEMP/flatpak"
          (cd dist && sha256sum ./*.flatpak | sed 's| \./| |' >SHA256SUMS-flatpak && cat SHA256SUMS-flatpak)
      # The bundle as a user installs it, with no GPU and no display: the
      # command line in the sandbox says its version, imports a picture and
      # exports it on the CPU, the window's program says its version. A
      # session bus and a runtime folder of its own, as a desktop has.
      - name: install, command line, uninstall
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          export XDG_RUNTIME_DIR="$RUNNER_TEMP/xdg-runtime"
          mkdir -p -m 700 "$XDG_RUNTIME_DIR"
          dbus-run-session -- bash packaging/flatpak/smoke.sh \
            "dist/io.github.quazardous.Helios-$VERSION-x86_64.flatpak" \
            crates/helios-plugin/tests/fixtures/rated-photos/a.jpg
      - uses: actions/upload-artifact@v4
        with:
          name: helios-${{ steps.version.outputs.version }}-flatpak-x86_64
          path: dist/
          if-no-files-found: error

  # The same programs for Windows x86_64 (MSVC), zipped with the licences,
  # and a per-user installer of the same folder (Inno Setup).
  build-windows:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    defaults:
      run:
        shell: bash
    steps:
      # Checked out as committed (LF): the data compiled in stays the same.
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.PUBLISH == 'true' && env.TAG || '' }}
      - name: version
        id: version
        run: echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@1.95
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-windows
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - name: build
        run: |
          cargo build --release --locked \
            -p helios-node -p helios-gui -p helios-plugin-darktable-library \
            -p helios-plugin-lightroom-catalog
      # Inno Setup 6, the installer's compiler, unless the image has it.
      - name: Inno Setup
        shell: pwsh
        run: |
          $found = (Get-Command ISCC.exe -ErrorAction SilentlyContinue) -or
            (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")
          if ($found) { Write-Output 'Inno Setup is installed' }
          else { choco install innosetup --no-progress -y; if ($LASTEXITCODE -ne 0) { exit 1 } }
      - name: package
        shell: pwsh
        run: ./packaging/windows/release.ps1 "${{ steps.version.outputs.version }}" target/release dist
      - uses: actions/upload-artifact@v4
        with:
          name: helios-${{ steps.version.outputs.version }}-windows-x86_64
          path: dist/
          if-no-files-found: error

  # The zip and the installer as a user gets them, on a Windows runner (no
  # GPU): the command line imports a picture and exports it on the CPU,
  # both programs say their version; the installer installs per user,
  # the same runs from the installed folder, and it uninstalls cleanly.
  smoke-windows:
    needs: build-windows
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.build-windows.outputs.version }}
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.PUBLISH == 'true' && env.TAG || '' }}
      - uses: actions/download-artifact@v4
        with:
          name: helios-${{ needs.build-windows.outputs.version }}-windows-x86_64
          path: dist
      - name: checksums
        shell: bash
        working-directory: dist
        run: sha256sum -c SHA256SUMS-windows
      - name: zip, command line
        shell: pwsh
        run: |
          ./packaging/windows/smoke.ps1 "dist/helios-$env:VERSION-windows-x86_64.zip" `
            crates/helios-plugin/tests/fixtures/rated-photos/a.jpg
      - name: installer, install, command line, uninstall
        shell: pwsh
        run: |
          ./packaging/windows/smoke-installer.ps1 "dist/helios-$env:VERSION-windows-x86_64-setup.exe" `
            crates/helios-plugin/tests/fixtures/rated-photos/a.jpg

  # macOS on Apple silicon (arm64), first slice: the same programs built
  # for aarch64-apple-darwin, signed ad hoc only, as a tarball kept with the
  # run's artefacts, and its smoke test (packaging/macos/smoke.sh). Not yet
  # attached to the Release, and allowed to fail: publish does not wait for
  # it. Helios links no C library of darktable's; the C its crates carry
  # (bundled SQLite and the like) builds with the runner's Xcode: no Homebrew.
  macos:
    runs-on: macos-15
    continue-on-error: true
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.PUBLISH == 'true' && env.TAG || '' }}
      - name: version
        id: version
        run: echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@1.95
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-macos
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - name: build
        run: |
          uname -m
          cargo build --release --locked \
            -p helios-node -p helios-gui -p helios-plugin-darktable-library
      - name: package
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: packaging/macos/release.sh "$VERSION" target/release dist
      - uses: actions/upload-artifact@v4
        with:
          name: helios-${{ steps.version.outputs.version }}-macos-arm64
          path: dist/
          if-no-files-found: error
      - name: smoke
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          (cd dist && shasum -a 256 -c SHA256SUMS-macos)
          packaging/macos/smoke.sh "dist/helios-$VERSION-macos-arm64.tar.gz" \
            crates/helios-plugin/tests/fixtures/rated-photos/a.jpg

  publish:
    needs: [build-linux, smoke-linux, flatpak, build-windows, smoke-windows]
    if: ${{ (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || inputs.publish == true }}
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.build-linux.outputs.version }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: helios-${{ needs.build-linux.outputs.version }}-linux-x86_64
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: helios-${{ needs.build-windows.outputs.version }}-windows-x86_64
          path: dist-windows
      - uses: actions/download-artifact@v4
        with:
          name: helios-${{ needs.flatpak.outputs.version }}-flatpak-x86_64
          path: dist-flatpak
      # One SHA256SUMS for every file attached.
      - name: checksums
        run: |
          mv dist-windows/helios-"$VERSION"-windows-x86_64.zip dist/
          mv dist-windows/helios-"$VERSION"-windows-x86_64-setup.exe dist/
          cat dist-windows/SHA256SUMS-windows >> dist/SHA256SUMS
          mv dist-flatpak/io.github.quazardous.Helios-"$VERSION"-x86_64.flatpak dist/
          cat dist-flatpak/SHA256SUMS-flatpak >> dist/SHA256SUMS
          (cd dist && sha256sum -c SHA256SUMS)
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files=(
            dist/helios-"$VERSION"-linux-x86_64.tar.gz
            dist/Helios-"$VERSION"-x86_64.AppImage
            dist/helios-"$VERSION"-windows-x86_64.zip
            dist/helios-"$VERSION"-windows-x86_64-setup.exe
            dist/io.github.quazardous.Helios-"$VERSION"-x86_64.flatpak
            dist/SHA256SUMS
          )
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "Helios $VERSION" --notes-file dist/release-notes.md "${files[@]}"

  # The new version on winget (docs/releases.md, "winget"): a pull request
  # on microsoft/winget-pkgs from the quazardous fork, opened by
  # winget-releaser (komac) from the installer just published and the
  # manifests of the version before it. Needs the WINGET_TOKEN secret (a
  # classic token with public_repo); without it the job says so and ends.
  # A failure here never fails the release: the Release is already out.
  winget:
    needs: publish
    if: ${{ !cancelled() && needs.publish.result == 'success' }}
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
    env:
      HAS_WINGET_TOKEN: ${{ secrets.WINGET_TOKEN != '' }}
    steps:
      - name: token
        if: env.HAS_WINGET_TOKEN != 'true'
        run: |
          msg="WINGET_TOKEN is not set: no winget-pkgs pull request for $TAG (docs/releases.md, \"winget\")"
          echo "::notice::$msg"
          echo "$msg" >> "$GITHUB_STEP_SUMMARY"
      - uses: vedantmgoyal9/winget-releaser@b7370d4d152efdce803a26cc6ca9eee58cb2ad54 # main, 2026-10-07
        if: env.HAS_WINGET_TOKEN == 'true'
        with:
          identifier: Quazardous.Helios
          release-tag: ${{ env.TAG }}
          installers-regex: '-windows-x86_64-setup\.exe$'
          release-notes-url: https://github.com/quazardous/helios/releases/tag/${{ env.TAG }}
          fork-user: quazardous
          token: ${{ secrets.WINGET_TOKEN }}
