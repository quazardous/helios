name: lint
description: >
  Every cheap check of a change, none of which builds a test: `cargo xtask
  lint` with every linter installed, the documentation without a warning,
  the UI index, the catalogues, the changelog fragments. Run by ci.yml's
  lint job (pushes, contributors' pull requests) and by pr-lint.yml (our
  own pull requests), so the two cannot drift. The caller checks the
  repository out and installs the Rust toolchain (and a cache, if any).
inputs:
  base:
    description: >
      The ref a pull request merges into: code changed since it comes with
      a changelog fragment, and the guards with a backlog report only what
      the change adds since its merge base with it. Empty on a push.
    default: ""
runs:
  using: composite
  steps:
    - uses: taiki-e/install-action@v2
      with:
        tool: cargo-deny,cargo-machete,taplo,typos
    - name: shellcheck and ruff
      shell: bash
      run: |
        # The runner image ships shellcheck: apt only if it ever stops.
        command -v shellcheck || { sudo apt-get -o Acquire::Retries=5 update -q && sudo apt-get -o Acquire::Retries=5 install -yq shellcheck; }
        pipx install ruff
    # rustfmt, clippy, deps-worlds, cargo-deny, cargo-machete, taplo, typos,
    # shellcheck, ruff. The steps after it run even when it fails, so one
    # run names everything there is to fix.
    # A pull request (a base given): the guards with a backlog (raw-egui,
    # bus) fail only on what it adds since its merge base; a push to next
    # runs them in full.
    - name: cargo xtask lint
      shell: bash
      env:
        BASE: ${{ inputs.base }}
      run: |
        if [ -n "$BASE" ]; then
          cargo xtask lint --require-all --base "$BASE"
        else
          cargo xtask lint --require-all
        fi
    - name: documentation without a warning
      if: ${{ !cancelled() }}
      shell: bash
      # A link from public documentation to a private item is allowed:
      # this is an application, read with its sources, not a published
      # library.
      env:
        RUSTDOCFLAGS: -D warnings -A rustdoc::private_intra_doc_links
      run: cargo doc --workspace --no-deps --locked --keep-going
    - name: docs/ui-index.md is current
      if: ${{ !cancelled() }}
      shell: bash
      run: cargo xtask ui-index --check
    - name: translation catalogues
      if: ${{ !cancelled() }}
      shell: bash
      run: cargo xtask i18n check
    - name: changelog fragments, plugin ranges and Cargo.lock
      if: ${{ !cancelled() }}
      shell: bash
      env:
        BASE: ${{ inputs.base }}
      run: |
        if [ -n "$BASE" ]; then
          cargo xtask check --base "$BASE"
        else
          cargo xtask check
        fi
