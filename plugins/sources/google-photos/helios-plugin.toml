id = "io.github.quazardous.helios.google-photos"
name = "Google Photos"
title = "Google Photos"
description = "Imports the photos you pick in Google Photos, through Google's Photos Picker API"
version = "0.1.0"
license = "GPL-3.0-or-later"
command = ["helios-google-photos"]
services = ["import.source"]
activation = ["onService:import.source"]

[compat]
helios = ">=0.83.0, <0.84.0"
interfaces = { protocol = 1, "import.source" = 1 }

# Where the Picker API answers; only tests change it.
[settings.api]
type = "string"
default = "https://photospicker.googleapis.com/v1"
about = "The Photos Picker API's base address"

# The connection process Helios drives (docs/design/import-connectors.md,
# 2.4.1): Google's sign-in for desktop applications, then a call proving
# the token works. The OAuth client is the person's own (Settings), the
# environment's or Helios's built-in one (docs/google-photos.md).
[[connect]]
id = "google"
kind = "oauth"
authorize = "https://accounts.google.com/o/oauth2/v2/auth"
token = "https://oauth2.googleapis.com/token"
revoke = "https://oauth2.googleapis.com/revoke"
scopes = ["https://www.googleapis.com/auth/photospicker.mediaitems.readonly"]

[[connect]]
id = "probe"
kind = "test"

[[capabilities]]
name = "network"
reason = "Talks to Google's Photos Picker API and downloads the photos you picked"

[[capabilities]]
name = "folder.write"
reason = "Downloads the picked photos into the folder Helios hands over"
