id = "io.github.quazardous.helios.google-photos"
name = "Google Photos"
title = "Google Photos"
description = "Imports the photos you pick in Google Photos, through Google's Photos Picker API"
version = "0.1.0"
license = "GPL-3.0-or-later"
command = ["helios-google-photos"]
services = ["import.source"]
activation = ["onService:import.source", "onHealth"]
# Google's API lets an application read only the photos picked in its own
# page (the library-wide scopes were withdrawn in March 2025): the import
# window browses this source through that page alone.
browsers = ["picker"]
# A picked item's preview comes from its address with `=w<n>-h<n>`
# (`source.thumbnail`): the import window's glances, kept on disk.
thumbnails = true
# What Helios asks of Google at most: reading glances ahead pauses here.
# Every install shares the OAuth client's project quota, so these stay
# well under it (`LIMITS` in src/lib.rs says the same).
limits = { per_minute = 120, per_day = 10000 }

[compat]
helios = ">=0.87.0, <0.88.0"
interfaces = { protocol = 1, "import.source" = 1, health = 1 }

# Where the Picker API answers; only tests change it.
[settings.api]
type = "string"
default = "https://photospicker.googleapis.com/v1"
about = "The Photos Picker API's base address"

# The connection process Helios drives (docs/design/import-connectors.md,
# 2.4.1): Google's sign-in for desktop applications, then a call proving
# the token works. The OAuth client is the person's own (Settings), the
# environment's or Helios's built-in one (docs/google-photos.md).
[[connect]]
id = "google"
kind = "oauth"
authorize = "https://accounts.google.com/o/oauth2/v2/auth"
token = "https://oauth2.googleapis.com/token"
revoke = "https://oauth2.googleapis.com/revoke"
# The picked items, and who the account is (its address, shown beside
# "Google Photos" so several accounts stay apart): docs/google-verification.md.
scopes = ["https://www.googleapis.com/auth/photospicker.mediaitems.readonly", "openid", "email"]

[[connect]]
id = "probe"
kind = "test"

[[capabilities]]
name = "network"
reason = "Talks to Google's Photos Picker API and downloads the photos you picked"

[[capabilities]]
name = "folder.write"
reason = "Downloads the picked photos into the folder Helios hands over"

# Its problem check (Help > Health check): each account Helios hands it
# is tried against the Picker API; one Google no longer takes needs
# reconnecting.
[[health]]
id = "accounts"
title = "Google Photos accounts"
watches = "Each Google Photos account still signs in"
levels = ["ok", "warning"]
fixes = ["import.reconnect"]
