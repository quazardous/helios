# ruff: lint and format the Python tools and test fixtures
# (`ruff check` and `ruff format`, or `cargo xtask lint`).
# https://docs.astral.sh/ruff/configuration/

line-length = 100
target-version = "py310"

[lint]
# pycodestyle, pyflakes, import order, bugbear, pyupgrade, simplify.
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
# Long lines are the formatter's call; what it leaves (long strings and
# URLs) stays.
ignore = ["E501"]
