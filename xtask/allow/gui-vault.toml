# Desktop files (crates/helios-gui/src) that still hold or call the vault
# instead of going through the node's client (see `cargo xtask check` and
# xtask/src/vault_access.rs). The list only shrinks: an entry whose file no
# longer does it is reported, and removed with the code that needed it.

[[allow]]
path = "crates/helios-gui/src/main.rs"
reason = "builds the desktop's node and hands its vault to the modules below, the backups, the accounts and the import window's prefilter"

[[allow]]
path = "crates/helios-gui/src/persist.rs"
reason = "builds the in-process node's client on the vault it is given; the vault() accessor still feeds main.rs"

[[allow]]
path = "crates/helios-gui/src/calibrate.rs"
reason = "the calibration commands run through endpoint::command on the node's vault, and the camera look's fit reads it; to move to the client"

[[allow]]
path = "crates/helios-gui/src/image_map.rs"
reason = "the image map's scan writes sightings and reads the known volumes from the vault; to move to the node"

[[allow]]
path = "crates/helios-gui/src/shell/storage.rs"
reason = "the Storage page reads and writes volumes, the strategy and backup statuses on the vault; to move to storage commands on the node"

[[allow]]
path = "crates/helios-gui/src/workshop_run.rs"
reason = "a workshop's run reads locations and writes versions and its book on the vault; to move to the client"

[[allow]]
path = "crates/helios-gui/src/workshop_run/review.rs"
reason = "a workshop run's review writes versions and replays changes on the vault; to move to the client"
