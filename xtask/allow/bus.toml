# The desktop's hand-rolled subscriptions to a fact bus (`.subscribe()`,
# `.subscribe_kinds(`) in crates/helios-gui/src, outside tests (see
# `cargo xtask bus --check` and xtask/src/bus.rs). The desktop follows
# node facts as named listeners: of the application bus's points, or of
# the node listener table (`node_events`). These are the exceptions, each
# with its reason. The list only shrinks: an entry whose file no longer
# subscribes is reported, and removed with the code that needed it.

[[allow]]
path = "crates/helios-gui/src/host.rs"
reason = "the window's waker: any fact on the shell bus that the interface did not publish asks for a frame; it reads no fact, it wakes"

[[allow]]
path = "crates/helios-gui/src/node_events.rs"
reason = "LocalRelay: the desktop's in-process node, followed on its own bus for the node listener table, whose listeners ask for kinds by prefix (storage.*, library.*, volume.*, cache.*): most of them JSON with no type, volume.* with typed points of their own crate, none a fact point to listen on"

[[allow]]
path = "crates/helios-gui/src/persist.rs"
reason = "the vault's events, process-local and high rate: the read cache hears them on its own thread so no read shows a value older than a change announced, and the frame applies them in order"
