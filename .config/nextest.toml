# cargo-nextest: one process per test, timings, slow-test warnings.
# `cargo nextest run` locally, `cargo nextest run --profile ci` in CI,
# `cargo xtask test-times` for the slowest tests and their history.
# Doctests do not run under nextest: `cargo test --doc` runs them.

[profile.default]
# Warn about a test still running after 10 s, stop it after 12 periods
# (120 s): a hung test fails instead of blocking the suite.
slow-timeout = { period = "10s", terminate-after = 12 }

# Every profile writes a JUnit report to target/nextest/<profile>/junit.xml,
# read by `cargo xtask test-times`.
[profile.default.junit]
path = "junit.xml"

[profile.ci]
# A test that fails then passes on its retry is reported FLAKY, not failed:
# the run stays green and the flaky test gets a ticket and a fix.
retries = 1
fail-fast = false
# More tests at once than cores is set by the box's jobs only
# (`--test-threads 12` in tools/bench/Benchfile): on CI's 4-core runners it
# starved the frame-time tests.

# Frame-time tests measure the UI's own speed: they run alone, never beside
# other tests.
[test-groups]
alone = { max-threads = 1 }

[[profile.default.overrides]]
filter = 'test(/stays_fluid|frame_budget|frames_stay/)'
test-group = 'alone'

[[profile.ci.overrides]]
filter = 'test(/stays_fluid|frame_budget|frames_stay/)'
test-group = 'alone'

# Tests that print what they measured: their output kept when they pass.
[[profile.default.overrides]]
filter = 'test(/a_cold_folder_fills|the_library_read_at_scale/)'
success-output = "final"

# The stability scenarios print where each kill landed: kept when they
# pass, for the `stability` job's report.
[[profile.default.overrides]]
filter = 'binary(stability)'
success-output = "final"

# The long soak lasts an hour by default (HELIOS_SOAK_MINUTES); its
# calls and its run have deadlines, so it cannot hang: a leash of up to
# three hours. Before the binary's own override, which would match first.
[[profile.default.overrides]]
filter = 'binary(many_clients) and test(soak_long)'
success-output = "final"
slow-timeout = { period = "60s", terminate-after = 180 }

# The many-clients stress run prints its report (calls per second,
# latencies, the node's memory and descriptors); the full run lasts a
# minute by default (HELIOS_STRESS_SECONDS), past the 120 s hang guard
# when it is set longer, so it gets a leash of its own. Each call and the
# run itself have deadlines: it cannot hang.
[[profile.default.overrides]]
filter = 'binary(many_clients)'
success-output = "final"
slow-timeout = { period = "30s", terminate-after = 20 }

# The library at scale: each test builds a vault of 30,000 to 100,000
# photos, a fixed amount of work that a loaded, throttled box slows five
# times over. Bound on counts (queries, stats), not seconds, they get a
# longer leash than the 120 s hang guard; they cannot hang.
[[profile.default.overrides]]
filter = 'binary(library_scale)'
slow-timeout = { period = "30s", terminate-after = 10 }
